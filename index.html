<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RADMIR WEBGL RP — Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
        body { overflow: hidden; background: #090d16; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }

        /* Полноэкранный современный лаунчер */
        #launcher-screen {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(circle at 75% 25%, #2e1065 0%, #0f172a 48%, #060913 100%);
            display: flex; flex-direction: column; justify-content: space-between; padding: 36px;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #launcher-screen.hidden { opacity: 0; pointer-events: none; transform: scale(1.03); }

        /* Верхний левый угол: Никнейм */
        .top-left-nick {
            position: absolute; top: 32px; left: 32px;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.35); border-radius: 18px;
            padding: 14px 20px; width: 310px; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
        }
        .top-left-nick label {
            display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
            color: #c084fc; font-weight: 700; margin-bottom: 6px;
        }
        .top-left-nick input {
            width: 100%; background: rgba(30, 41, 59, 0.9); border: 1px solid #334155;
            border-radius: 10px; padding: 10px 14px; color: white; font-size: 15px; font-weight: 600; outline: none;
            transition: border-color 0.2s;
        }
        .top-left-nick input:focus { border-color: #a855f7; }
        #nick-error { color: #f87171; font-size: 12px; margin-top: 6px; min-height: 16px; }

        /* Центральный баннер лаунчера */
        .launcher-center {
            margin: auto; text-align: center; pointer-events: none;
        }
        .launcher-center h1 {
            font-size: 54px; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 50%, #6366f1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 40px rgba(168, 85, 247, 0.3);
        }
        .launcher-center p { color: #94a3b8; font-size: 16px; margin-top: 8px; }

        /* Правый нижний угол: Выбор сервера + Кнопка Играть */
        .bottom-right-controls {
            position: absolute; bottom: 32px; right: 32px;
            display: flex; align-items: center; gap: 14px;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px);
            padding: 14px 18px; border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .bottom-right-controls select {
            background: #1e293b; color: white; border: 1px solid #334155;
            padding: 15px 18px; border-radius: 14px; font-size: 15px; font-weight: 600;
            outline: none; cursor: pointer; min-width: 240px;
        }
        .bottom-right-controls button {
            background: linear-gradient(135deg, #9333ea 0%, #4f46e5 100%);
            color: white; border: none; padding: 15px 38px; border-radius: 14px;
            font-size: 17px; font-weight: 800; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(147, 51, 234, 0.45); transition: all 0.2s ease;
        }
        .bottom-right-controls button:hover {
            transform: translateY(-2px); box-shadow: 0 12px 30px rgba(147, 51, 234, 0.65); filter: brightness(1.1);
        }

        /* Современный экран загрузки */
        #loading-screen {
            position: fixed; inset: 0; z-index: 150; background: #070a12;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.45s ease;
        }
        #loading-screen.active { opacity: 1; pointer-events: auto; }
        .spinner-ring {
            width: 68px; height: 68px; border-radius: 50%;
            border: 4px solid rgba(168, 85, 247, 0.15); border-top-color: #a855f7; border-right-color: #6366f1;
            animation: spin 0.9s linear infinite; margin-bottom: 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-title { color: white; font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        #loading-status { color: #94a3b8; font-size: 14px; margin-bottom: 22px; }
        .progress-track {
            width: 360px; height: 8px; background: #1e293b; border-radius: 99px; overflow: hidden;
        }
        #progress-fill {
            width: 0%; height: 100%; background: linear-gradient(90deg, #a855f7, #38bdf8);
            border-radius: 99px; transition: width 0.15s ease-out;
        }

        /* Игровой интерфейс (HUD) */
        #hud { display: none; position: fixed; inset: 0; pointer-events: none; }
        #chat-container { position: absolute; top: 20px; left: 20px; width: 430px; pointer-events: auto; }
        #chat-messages {
            background: rgba(15, 23, 42, 0.72); border-radius: 16px; padding: 14px;
            height: 185px; overflow-y: auto; color: white; font-size: 14px; line-height: 1.45;
            display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid rgba(255,255,255,0.12);
        }
        #chat-input {
            display: none; width: 100%; margin-top: 8px; padding: 11px 15px; border-radius: 12px;
            border: 1px solid #a855f7; background: #0f172a; color: white; font-size: 14px; outline: none;
        }
        #server-info {
            position: absolute; top: 20px; right: 20px; background: rgba(15, 23, 42, 0.78);
            padding: 12px 18px; border-radius: 16px; text-align: right; border: 1px solid rgba(255,255,255,0.12);
        }
        #server-badge { color: #c084fc; font-weight: bold; font-size: 15px; }
        #money-badge { color: #4ade80; font-weight: bold; font-size: 18px; margin-top: 4px; }
        #location-badge { color: #cbd5e1; font-size: 13px; margin-top: 4px; }
        #controls-hint {
            position: absolute; bottom: 20px; left: 20px; background: rgba(15, 23, 42, 0.78);
            color: #e2e8f0; padding: 12px 18px; border-radius: 16px; font-size: 13px; line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Полноэкранный лаунчер -->
    <div id="launcher-screen">
        <!-- Верхний левый угол: Ник -->
        <div class="top-left-nick">
            <label for="nick-input">Ваш игровой ник</label>
            <input type="text" id="nick-input" placeholder="Например: Domik_Brane" maxlength="20">
            <div id="nick-error"></div>
        </div>

        <!-- Центр: Логотип -->
        <div class="launcher-center">
            <h1>RADMIR WEB RP</h1>
            <p>Официальный веб-лаунчер • 3D WebGL Engine</p>
        </div>

        <!-- Правый нижний угол: Выбор сервера и кнопка Играть -->
        <div class="bottom-right-controls">
            <select id="server-select">
                <option value="Server #01 | Арзамас">Server #01 | Арзамас (Онлайн: 418)</option>
                <option value="Server #02 | Южный">Server #02 | Южный (Онлайн: 295)</option>
                <option value="Server #03 | Dev Test">Server #03 | Dev Test (Онлайн: 12)</option>
            </select>
            <button onclick="launchGame()">ИГРАТЬ</button>
        </div>
    </div>

    <!-- Экран современной загрузки -->
    <div id="loading-screen">
        <div class="spinner-ring"></div>
        <div class="loading-title" id="loading-server-name">Подключение к серверу...</div>
        <div id="loading-status">Инициализация 3D-движка WebGL...</div>
        <div class="progress-track">
            <div id="progress-fill"></div>
        </div>
    </div>

    <!-- Игровой HUD -->
    <div id="hud">
        <div id="server-info">
            <div id="server-badge">Server #01 | Арзамас</div>
            <div id="money-badge">50 000 ₽</div>
            <div id="location-badge">Район: Центральный проспект</div>
        </div>
        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Сообщение или команды: /me, /do, /n, /gps...">
        </div>
        <div id="controls-hint">
            <b>WASD</b> — Ходьба / Езда | <b>Shift</b> — Бег | <b>Пробел</b> — Прыжок<br>
            <b>F</b> — Сесть / Выйти из машины | <b>T</b> — Чат | <b>Мышь</b> — Вращать камеру
        </div>
    </div>

    <canvas id="glCanvas"></canvas>

    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl');
        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            gl.viewport(0, 0, W, H);
        }
        window.addEventListener('resize', resize);
        resize();

        const vsSrc = `
            attribute vec3 aPos;
            attribute vec3 aNorm;
            attribute vec2 aUV;
            uniform mat4 uProj;
            uniform mat4 uView;
            uniform mat4 uModel;
            uniform vec2 uUVScale;
            varying vec3 vNorm;
            varying vec2 vUV;
            varying float vDist;
            void main() {
                vec4 worldPos = uModel * vec4(aPos, 1.0);
                vec4 viewPos = uView * worldPos;
                gl_Position = uProj * viewPos;
                vNorm = mat3(uModel) * aNorm;
                vUV = aUV * uUVScale;
                vDist = -viewPos.z;
            }
        `;
        const fsSrc = `
            precision mediump float;
            varying vec3 vNorm;
            varying vec2 vUV;
            varying float vDist;
            uniform sampler2D uTex;
            uniform vec3 uTint;
            void main() {
                vec3 sunDir = normalize(vec3(0.5, 0.85, 0.4));
                float light = max(dot(normalize(vNorm), sunDir), 0.0) * 0.65 + 0.45;
                vec4 texCol = texture2D(uTex, vUV);
                vec3 col = texCol.rgb * uTint * light;
                float fog = clamp((vDist - 55.0) / 150.0, 0.0, 1.0);
                col = mix(col, vec3(0.53, 0.81, 0.98), fog);
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        function compileShader(type, src) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
        }
        const prog = gl.createProgram();
        gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSrc));
        gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSrc));
        gl.linkProgram(prog);
        gl.useProgram(prog);
        gl.enable(gl.DEPTH_TEST);
        function createGLTexture(type) {
            const c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            const g = c.getContext('2d');

            if (type === 'asphalt') {
                g.fillStyle = '#262b34'; g.fillRect(0, 0, 128, 128);
                for (let i = 0; i < 600; i++) {
                    g.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.3)';
                    g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
                }
            } else if (type === 'grass') {
                g.fillStyle = '#3b6625'; g.fillRect(0, 0, 128, 128);
                for (let i = 0; i < 500; i++) {
                    g.fillStyle = i % 2 === 0 ? '#4a7c31' : '#2d4f1c';
                    g.fillRect(Math.random() * 128, Math.random() * 128, 3, 3);
                }
            } else if (type === 'windows') {
                g.fillStyle = '#cbd5e1'; g.fillRect(0, 0, 128, 128);
                g.fillStyle = '#0f172a';
                for (let y = 12; y < 116; y += 38) {
                    for (let x = 12; x < 116; x += 38) {
                        g.fillRect(x, y, 24, 26);
                        g.fillStyle = '#38bdf8';
                        g.fillRect(x + 2, y + 2, 8, 22);
                        g.fillStyle = '#0f172a';
                    }
                }
            } else if (type === 'brick') {
                g.fillStyle = '#991b1b'; g.fillRect(0, 0, 128, 128);
                g.fillStyle = '#7f1d1d';
                for (let y = 0; y < 128; y += 16) {
                    g.fillRect(0, y, 128, 2);
                    for (let x = (y / 16) % 2 * 16; x < 128; x += 32) g.fillRect(x, y, 2, 16);
                }
            } else {
                g.fillStyle = '#ffffff'; g.fillRect(0, 0, 128, 128);
            }

            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
            gl.generateMipmap(gl.TEXTURE_2D);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            return tex;
        }

        const textures = {
            asphalt: createGLTexture('asphalt'),
            grass: createGLTexture('grass'),
            windows: createGLTexture('windows'),
            brick: createGLTexture('brick'),
            white: createGLTexture('white')
        };

        const boxVerts = new Float32Array([
            -0.5,-0.5, 0.5,  0, 0, 1,  0,1,   0.5,-0.5, 0.5,  0, 0, 1,  1,1,   0.5, 0.5, 0.5,  0, 0, 1,  1,0,
            -0.5,-0.5, 0.5,  0, 0, 1,  0,1,   0.5, 0.5, 0.5,  0, 0, 1,  1,0,  -0.5, 0.5, 0.5,  0, 0, 1,  0,0,
             0.5,-0.5,-0.5,  0, 0,-1,  0,1,  -0.5,-0.5,-0.5,  0, 0,-1,  1,1,  -0.5, 0.5,-0.5,  0, 0,-1,  1,0,
             0.5,-0.5,-0.5,  0, 0,-1,  0,1,  -0.5, 0.5,-0.5,  0, 0,-1,  1,0,   0.5, 0.5,-0.5,  0, 0,-1,  0,0,
            -0.5, 0.5, 0.5,  0, 1, 0,  0,1,   0.5, 0.5, 0.5,  0, 1, 0,  1,1,   0.5, 0.5,-0.5,  0, 1, 0,  1,0,
            -0.5, 0.5, 0.5,  0, 1, 0,  0,1,   0.5, 0.5,-0.5,  0, 1, 0,  1,0,  -0.5, 0.5,-0.5,  0, 1, 0,  0,0,
            -0.5,-0.5,-0.5,  0,-1, 0,  0,1,   0.5,-0.5,-0.5,  0,-1, 0,  1,1,   0.5,-0.5, 0.5,  0,-1, 0,  1,0,
            -0.5,-0.5,-0.5,  0,-1, 0,  0,1,   0.5,-0.5, 0.5,  0,-1, 0,  1,0,  -0.5,-0.5, 0.5,  0,-1, 0,  0,0,
             0.5,-0.5, 0.5,  1, 0, 0,  0,1,   0.5,-0.5,-0.5,  1, 0, 0,  1,1,   0.5, 0.5,-0.5,  1, 0, 0,  1,0,
             0.5,-0.5, 0.5,  1, 0, 0,  0,1,   0.5, 0.5,-0.5,  1, 0, 0,  1,0,   0.5, 0.5, 0.5,  1, 0, 0,  0,0,
            -0.5,-0.5,-0.5, -1, 0, 0,  0,1,  -0.5,-0.5, 0.5, -1, 0, 0,  1,1,  -0.5, 0.5, 0.5, -1, 0, 0,  1,0,
            -0.5,-0.5,-0.5, -1, 0, 0,  0,1,  -0.5, 0.5, 0.5, -1, 0, 0,  1,0,  -0.5, 0.5,-0.5, -1, 0, 0,  0,0
        ]);

        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, boxVerts, gl.STATIC_DRAW);

        const aPos = gl.getAttribLocation(prog, 'aPos');
        const aNorm = gl.getAttribLocation(prog, 'aNorm');
        const aUV = gl.getAttribLocation(prog, 'aUV');
        gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 32, 0);
        gl.enableVertexAttribArray(aNorm); gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 32, 12);
        gl.enableVertexAttribArray(aUV); gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 32, 24);
        const uProj = gl.getUniformLocation(prog, 'uProj');
        const uView = gl.getUniformLocation(prog, 'uView');
        const uModel = gl.getUniformLocation(prog, 'uModel');
        const uUVScale = gl.getUniformLocation(prog, 'uUVScale');
        const uTint = gl.getUniformLocation(prog, 'uTint');

        function draw3DBox(x, y, z, sx, sy, sz, rotY, tex, r, g, b, uvX = 1, uvY = 1) {
            const c = Math.cos(rotY), s = Math.sin(rotY);
            const m = new Float32Array([
                sx * c, 0, -sx * s, 0,
                0, sy, 0, 0,
                sz * s, 0, sz * c, 0,
                x, y, z, 1
            ]);
            gl.uniformMatrix4fv(uModel, false, m);
            gl.uniform2f(uUVScale, uvX, uvY);
            gl.uniform3f(uTint, r, g, b);
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.drawArrays(gl.TRIANGLES, 0, 36);
        }

        function setCamera(eyeX, eyeY, eyeZ, targetX, targetY, targetZ) {
            const aspect = W / H, fov = 1.05, near = 0.2, far = 300;
            const f = 1.0 / Math.tan(fov / 2);
            gl.uniformMatrix4fv(uProj, false, new Float32Array([
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far + near) / (near - far), -1,
                0, 0, (2 * far * near) / (near - far), 0
            ]));

            let zx = eyeX - targetX, zy = eyeY - targetY, zz = eyeZ - targetZ;
            let zl = Math.hypot(zx, zy, zz); zx /= zl; zy /= zl; zz /= zl;
            let xx = zz, xy = 0, xz = -zx;
            let xl = Math.hypot(xx, xz) || 1; xx /= xl; xz /= xl;
            let yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;

            gl.uniformMatrix4fv(uView, false, new Float32Array([
                xx, yx, zx, 0,
                xy, yy, zy, 0,
                xz, yz, zz, 0,
                -(xx * eyeX + xy * eyeY + xz * eyeZ),
                -(yx * eyeX + yy * eyeY + yz * eyeZ),
                -(zx * eyeX + zy * eyeY + zz * eyeZ), 1
            ]));
        }

        let playerNick = "Domik_Brane";
        let isGameStarted = false;
        let isChatOpen = false;
        let camYaw = 0;
        let camPitch = 0.35;

        const player = { x: -4, y: 0, z: 12, vy: 0, angle: 0, walkTime: 0 };
        const cars = [
            { x: 3.5, z: 12, angle: 0, speed: 0, r: 0.12, g: 0.13, b: 0.16, name: 'BMW M5 F90' },
            { x: -16, z: -12, angle: 0.5, speed: 0, r: 0.58, g: 0.2, b: 0.92, name: 'Nissan GT-R' }
        ];
        let currentCar = null;

        let isDragging = false;
        canvas.addEventListener('mousedown', () => {
            isDragging = true;
            if (isGameStarted && !isChatOpen && canvas.requestPointerLock) canvas.requestPointerLock();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isGameStarted || isChatOpen) return;
            if (document.pointerLockElement === canvas || isDragging) {
                camYaw -= e.movementX * 0.005;
                camPitch = Math.max(0.05, Math.min(1.25, camPitch + e.movementY * 0.004));
            }
        });

        // Плавная анимация загрузки при нажатии "ИГРАТЬ"
        function launchGame() {
            const nick = document.getElementById('nick-input').value.trim();
            if (nick.length < 3) {
                document.getElementById('nick-error').innerText = "Введите ник минимум из 3 символов!";
                return;
            }
            playerNick = nick;
            const serverVal = document.getElementById('server-select').value;
            document.getElementById('server-badge').innerText = serverVal;
            document.getElementById('loading-server-name').innerText = "Вход на " + serverVal;

            // Плавно скрываем лаунчер и показываем экран загрузки
            document.getElementById('launcher-screen').classList.add('hidden');
            const loader = document.getElementById('loading-screen');
            const fill = document.getElementById('progress-fill');
            const status = document.getElementById('loading-status');
            loader.classList.add('active');

            let progress = 0;
            const steps = [
                { p: 25, text: "Соединение с игровым сервером..." },
                { p: 55, text: "Загрузка текстур города Арзамас..." },
                { p: 85, text: "Синхронизация автопарка и персонажа..." },
                { p: 100, text: "Добро пожаловать в игру!" }
            ];
            let stepIdx = 0;

            const timer = setInterval(() => {
                progress += 4;
                fill.style.width = progress + "%";
                if (stepIdx < steps.length && progress >= steps[stepIdx].p) {
                    status.innerText = steps[stepIdx].text;
                    stepIdx++;
                }
                if (progress >= 100) {
                    clearInterval(timer);
                    setTimeout(() => {
                        loader.classList.remove('active');
                        document.getElementById('hud').style.display = 'block';
                        isGameStarted = true;
                        addChatMessage(`<span style="color:#facc15">[Сервер]: Добро пожаловать на RADMIR WEB RP, ${playerNick}!</span>`);
                        addChatMessage(`<span style="color:#c084fc">[Подсказка]: Кликни мышью по экрану для обзора на 360°. [F] — сесть в машину.</span>`);
                    }, 350);
                }
            }, 60);
        }

        function addChatMessage(html) {
            const box = document.getElementById('chat-messages');
            box.innerHTML += `<div>${html}</div>`;
            box.scrollTop = box.scrollHeight;
        }
        const keys = {};
        window.addEventListener('keydown', (e) => {
            if (!isGameStarted) return;
            if (e.code === 'KeyT' && !isChatOpen) {
                e.preventDefault();
                isChatOpen = true;
                if (document.exitPointerLock) document.exitPointerLock();
                const inp = document.getElementById('chat-input');
                inp.style.display = 'block';
                inp.focus();
                return;
            }
            if (isChatOpen) {
                if (e.code === 'Enter') {
                    const inp = document.getElementById('chat-input');
                    const txt = inp.value.trim();
                    if (txt) {
                        if (txt === '/gps') addChatMessage(`<span style="color:#38bdf8">[GPS]: 1. Кремль | 2. Автосалон | 3. Пост ДПС</span>`);
                        else if (txt.startsWith('/me ')) addChatMessage(`<span style="color:#f472b6">* ${playerNick} ${txt.slice(4)}</span>`);
                        else if (txt.startsWith('/do ')) addChatMessage(`<span style="color:#38bdf8">${txt.slice(4)} (${playerNick})</span>`);
                        else if (txt.startsWith('/n ')) addChatMessage(`<span style="color:#9ca3af">(( ${playerNick}: ${txt.slice(3)} ))</span>`);
                        else addChatMessage(`${playerNick}: ${txt}`);
                    }
                    inp.value = '';
                    inp.style.display = 'none';
                    isChatOpen = false;
                } else if (e.code === 'Escape') {
                    document.getElementById('chat-input').style.display = 'none';
                    isChatOpen = false;
                }
                return;
            }
            if (e.code === 'KeyF') {
                if (!currentCar) {
                    for (let c of cars) {
                        if (Math.hypot(player.x - c.x, player.z - c.z) < 4.5) {
                            currentCar = c;
                            addChatMessage(`<span style="color:#f472b6">* ${playerNick} открыл дверь и сел в ${c.name}</span>`);
                            break;
                        }
                    }
                } else {
                    player.x = currentCar.x - 2.5;
                    player.z = currentCar.z;
                    addChatMessage(`<span style="color:#f472b6">* ${playerNick} вышел из ${currentCar.name}</span>`);
                    currentCar = null;
                }
            }
            keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function loop() {
            requestAnimationFrame(loop);

            if (isGameStarted && !isChatOpen) {
                if (!currentCar) {
                    let spd = keys['ShiftLeft'] ? 0.24 : 0.13;
                    let dx = 0, dz = 0, moved = false;
                    if (keys['KeyW']) { dx -= Math.sin(camYaw); dz -= Math.cos(camYaw); moved = true; }
                    if (keys['KeyS']) { dx += Math.sin(camYaw); dz += Math.cos(camYaw); moved = true; }
                    if (keys['KeyA']) { dx -= Math.cos(camYaw); dz += Math.sin(camYaw); moved = true; }
                    if (keys['KeyD']) { dx += Math.cos(camYaw); dz -= Math.sin(camYaw); moved = true; }

                    if (moved) {
                        player.x += dx * spd;
                        player.z += dz * spd;
                        player.angle = Math.atan2(dx, dz);
                        player.walkTime += spd * 1.8;
                    } else {
                        player.walkTime = 0;
                    }

                    if (keys['Space'] && player.y <= 0.01) player.vy = 0.22;
                    player.y += player.vy;
                    if (player.y > 0) player.vy -= 0.012;
                    else { player.y = 0; player.vy = 0; }
                } else {
                    if (keys['KeyW']) currentCar.speed = Math.min(currentCar.speed + 0.02, 0.8);
                    else if (keys['KeyS']) currentCar.speed = Math.max(currentCar.speed - 0.02, -0.35);
                    else currentCar.speed *= 0.96;

                    if (Math.abs(currentCar.speed) > 0.01) {
                        let dir = currentCar.speed > 0 ? 1 : -1;
                        if (keys['KeyA']) currentCar.angle += 0.04 * dir;
                        if (keys['KeyD']) currentCar.angle -= 0.04 * dir;
                    }
                    currentCar.x += Math.sin(currentCar.angle) * currentCar.speed;
                    currentCar.z += Math.cos(currentCar.angle) * currentCar.speed;
                }
            }

            let target = currentCar || player;
            let ty = currentCar ? 1.2 : player.y + 1.5;
            let dist = currentCar ? 10 : 7.5;
            let eyeX = target.x + Math.sin(camYaw) * Math.cos(camPitch) * dist;
            let eyeY = ty + Math.sin(camPitch) * dist;
            let eyeZ = target.z + Math.cos(camYaw) * Math.cos(camPitch) * dist;

            const loc = document.getElementById('location-badge');
            if (target.x > 5 && target.z < -5) loc.innerText = "Район: Арзамасский Кремль";
            else if (target.x < -10 && target.z < -5) loc.innerText = "Район: Автосалон Люкс";
            else if (target.z > 32) loc.innerText = "Район: Пост ДПС";
            else loc.innerText = "Район: Центральный проспект";

            gl.clearColor(0.53, 0.81, 0.98, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            setCamera(eyeX, eyeY, eyeZ, target.x, ty, target.z);

            // Земля, тротуары и асфальт с разметкой
            draw3DBox(0, -0.1, 0, 320, 0.2, 320, 0, textures.grass, 1, 1, 1, 40, 40);
            draw3DBox(0, 0.01, 0, 18, 0.05, 240, 0, textures.white, 0.6, 0.65, 0.7, 1, 1);
            draw3DBox(0, 0.03, 0, 13, 0.05, 240, 0, textures.asphalt, 1, 1, 1, 3, 45);
            draw3DBox(0, 0.03, 0, 240, 0.05, 13, 0, textures.asphalt, 1, 1, 1, 45, 3);
            for (let z = -100; z <= 100; z += 12) {
                if (Math.abs(z) > 10) draw3DBox(0, 0.06, z, 0.35, 0.02, 5, 0, textures.white, 0.98, 0.8, 0.1, 1, 1);
            }

            // Здания города
            draw3DBox(26, 5.5, -25, 28, 11, 14, 0, textures.brick, 1, 1, 1, 5, 2);
            draw3DBox(12, 11, -25, 6, 22, 6, 0, textures.brick, 1, 1, 1, 2, 4);
            draw3DBox(-26, 4.5, -22, 24, 9, 18, 0, textures.windows, 0.4, 0.8, 1.0, 4, 2);
            draw3DBox(12, 2, 42, 5, 4, 5, 0, textures.white, 0.95, 0.95, 0.98, 1, 1);
            draw3DBox(12, 2.2, 42, 5.1, 0.6, 5.1, 0, textures.white, 0.15, 0.4, 0.9, 1, 1);
            draw3DBox(-25, 9, 24, 14, 18, 14, 0, textures.windows, 0.9, 0.92, 0.95, 3, 4);
            draw3DBox(-25, 12.5, 52, 14, 25, 14, 0, textures.windows, 1.0, 0.9, 0.65, 3, 5);
            draw3DBox(26, 10, 26, 14, 20, 14, 0, textures.windows, 0.85, 0.9, 0.95, 3, 4);

            // Деревья
            for (let z = -72; z <= 72; z += 18) {
                if (Math.abs(z) < 12) continue;
                [-11, 11].forEach(tx => {
                    draw3DBox(tx, 1.25, z, 0.5, 2.5, 0.5, 0, textures.white, 0.45, 0.25, 0.1, 1, 1);
                    draw3DBox(tx, 3.8, z, 2.8, 3.0, 2.8, 0, textures.grass, 0.6, 1.1, 0.5, 2, 2);
                });
            }

            // Машины
            cars.forEach(c => {
                const cos = Math.cos(c.angle), sin = Math.sin(c.angle);
                draw3DBox(c.x, 0.65, c.z, 2.2, 0.65, 4.4, c.angle, textures.white, c.r, c.g, c.b, 1, 1);
                draw3DBox(c.x - sin * 0.2, 1.25, c.z - cos * 0.2, 1.8, 0.55, 2.2, c.angle, textures.white, 0.08, 0.12, 0.18, 1, 1);
                draw3DBox(c.x + sin * 2.21, 0.65, c.z + cos * 2.21, 1.6, 0.2, 0.08, c.angle, textures.white, 1.0, 0.95, 0.6, 1, 1);
                [-0.95, 0.95].forEach(wx => {
                    [-1.3, 1.3].forEach(wz => {
                        draw3DBox(c.x + wx * cos + wz * sin, 0.35, c.z - wx * sin + wz * cos, 0.35, 0.7, 0.7, c.angle, textures.white, 0.1, 0.1, 0.1, 1, 1);
                    });
                });
            });

            // Анимированный 3D-зомби
            if (!currentCar) {
                const cos = Math.cos(player.angle), sin = Math.sin(player.angle);
                const swing = Math.sin(player.walkTime) * 0.25;
                draw3DBox(player.x - 0.18 * cos + sin * swing, player.y + 0.4, player.z + 0.18 * sin + cos * swing, 0.24, 0.8, 0.24, player.angle, textures.white, 0.15, 0.2, 0.28, 1, 1);
                draw3DBox(player.x + 0.18 * cos - sin * swing, player.y + 0.4, player.z - 0.18 * sin - cos * swing, 0.24, 0.8, 0.24, player.angle, textures.white, 0.15, 0.2, 0.28, 1, 1);
                draw3DBox(player.x, player.y + 1.25, player.z, 0.72, 0.9, 0.38, player.angle, textures.white, 0.15, 0.35, 0.75, 1, 1);
                draw3DBox(player.x - 0.48 * cos + sin * 0.25, player.y + 1.48, player.z + 0.48 * sin + cos * 0.25, 0.2, 0.22, 0.65, player.angle, textures.white, 0.25, 0.75, 0.35, 1, 1);
                draw3DBox(player.x + 0.48 * cos + sin * 0.25, player.y + 1.48, player.z - 0.48 * sin + cos * 0.25, 0.2, 0.22, 0.65, player.angle, textures.white, 0.25, 0.75, 0.35, 1, 1);
                draw3DBox(player.x, player.y + 1.95, player.z, 0.5, 0.5, 0.5, player.angle, textures.white, 0.25, 0.75, 0.35, 1, 1);
                draw3DBox(player.x + sin * 0.26, player.y + 2.0, player.z + cos * 0.26, 0.32, 0.08, 0.04, player.angle, textures.white, 0.95, 0.15, 0.15, 1, 1);
            }
        }
        loop();
    </script>
</body>
</html>
