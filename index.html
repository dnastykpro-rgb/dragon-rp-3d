<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Test Server 3D Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { overflow: hidden; background: #0b0f19; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }

        #launcher {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            transition: opacity 0.4s ease;
        }
        #launcher.hidden { opacity: 0; pointer-events: none; }

        .auth-panel {
            position: absolute; top: 28px; left: 28px;
            background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 18px; padding: 18px 20px; width: 300px;
        }
        .auth-panel label { display: block; font-size: 11px; color: #c084fc; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        .auth-panel input {
            width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 10px;
            padding: 10px 12px; color: white; font-size: 14px; outline: none; margin-bottom: 12px;
        }
        #auth-msg { color: #f87171; font-size: 12px; min-height: 16px; }

        .play-panel {
            position: absolute; bottom: 28px; right: 28px; display: flex; align-items: center; gap: 12px;
            background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 12px 16px;
        }
        .play-panel select {
            background: #1e293b; color: white; border: 1px solid #334155;
            padding: 14px 16px; border-radius: 12px; font-size: 15px; font-weight: 600; outline: none;
        }
        .play-panel button {
            background: linear-gradient(135deg, #9333ea, #4f46e5); color: white; border: none;
            padding: 14px 34px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer;
        }

        #hud { display: none; position: fixed; inset: 0; pointer-events: none; }
        #badge {
            position: absolute; top: 20px; right: 20px; background: rgba(15, 23, 42, 0.78);
            color: #c084fc; padding: 10px 16px; border-radius: 12px; font-weight: bold; font-size: 14px;
        }
        #chat-box { position: absolute; top: 20px; left: 20px; width: 410px; pointer-events: auto; }
        #chat-log {
            background: rgba(15, 23, 42, 0.68); border-radius: 14px; padding: 12px;
            height: 170px; overflow-y: auto; color: white; font-size: 13px; line-height: 1.45;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        #chat-input {
            display: none; width: 100%; margin-top: 6px; padding: 10px 14px; border-radius: 10px;
            border: 1px solid #a855f7; background: #0f172a; color: white; font-size: 14px; outline: none;
        }
        #hint {
            position: absolute; bottom: 20px; left: 20px; background: rgba(15, 23, 42, 0.78);
            color: #e2e8f0; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.6;
        }
        #labels-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .player-tag {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0,0,0,0.65); color: white; padding: 3px 8px; border-radius: 6px;
            font-size: 12px; font-weight: bold; white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="launcher">
        <div class="auth-panel">
            <label>Игровой ник</label>
            <input type="text" id="nick-input" placeholder="Например: Domik_Brane" maxlength="20">
            <label>Пароль от аккаунта</label>
            <input type="password" id="pass-input" placeholder="Введите пароль" maxlength="32">
            <div id="auth-msg"></div>
        </div>
        <div class="play-panel">
            <select id="server-select"><option value="Test Server #1">Test Server #1 (Three.js)</option></select>
            <button onclick="loginAndPlay()">ВОЙТИ В ИГРУ</button>
        </div>
    </div>

    <div id="labels-layer"></div>

    <div id="hud">
        <div id="badge">Test Server #1</div>
        <div id="chat-box">
            <div id="chat-log"></div>
            <input type="text" id="chat-input" placeholder="Написать в чат или /me...">
        </div>
        <div id="hint">
            <b>WASD</b> — Движение | <b>Shift</b> — Бег | <b>Пробел</b> — Прыжок | <b>T</b> — Чат<br>
            <b>F</b> — Сесть за руль | <b>G</b> — Пассажиром к игроку | <b>H</b> — Пожать руку
        </div>
    </div>

    <script src="./three.min.js"></script>
    <script src="./GLTFLoader.js"></script>
    <script>
        const DB_URL = "https://" + "test-83342-default-rtdb" + ".firebaseio.com";

        // Сцена, камера, рендерер с мягкими тенями
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 40, 180);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.2, 250);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Солнечный свет и окружение
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.7);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(30, 50, 25);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Тестовый пол с координатной сеткой
        const floorGeo = new THREE.PlaneGeometry(250, 250);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(250, 100, 0x64748b, 0x475569);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Загрузчик твоей 3D-машины car.glb (с авто-масштабированием под размер игрока)
        const gltfLoader = new THREE.GLTFLoader();
        let carTemplate = null;

        function createFallbackCar(hexColor) {
            const grp = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.65, 4.3), new THREE.MeshStandardMaterial({ color: hexColor, roughness: 0.3, metalness: 0.6 }));
            body.position.y = 0.55; body.castShadow = true;
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.5, 2.0), new THREE.MeshStandardMaterial({ color: 0x111827 }));
            cabin.position.set(0, 1.1, -0.2); cabin.castShadow = true;
            grp.add(body, cabin);
            return grp;
        }

        const myCarMesh = new THREE.Group();
        myCarMesh.position.set(3, 0, 0);
        scene.add(myCarMesh);

        gltfLoader.load('./car.glb', (gltf) => {
            const model = gltf.scene;
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 4.4 / (maxDim || 1); // Подгоняем длину любой скачанной машины под 4.4 метра
            model.scale.set(scale, scale, scale);

            const scaledBox = new THREE.Box3().setFromObject(model);
            model.position.y = -scaledBox.min.y; // Ставим колёсами ровно на асфальт
            model.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });

            carTemplate = model;
            myCarMesh.add(carTemplate.clone());
        }, undefined, () => {
            myCarMesh.add(createFallbackCar(0x7c3aed));
        });
        function createHumanModel(hoodieColorHex) {
            const root = new THREE.Group();
            const matHoodie = new THREE.MeshStandardMaterial({ color: hoodieColorHex, roughness: 0.7 });
            const matSkin = new THREE.MeshStandardMaterial({ color: 0xc48f70, roughness: 0.6 });
            const matJeans = new THREE.MeshStandardMaterial({ color: 0x171923, roughness: 0.8 });
            const matWhite = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.4 });
            const matGlove = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.5 });

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.20, 0.58, 12), matHoodie);
            torso.position.y = 1.24; torso.castShadow = true;
            const tee = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.21, 0.12, 12), matWhite);
            tee.position.y = 0.92; tee.castShadow = true;

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 14), matSkin);
            head.position.set(0, 1.68, 0.02); head.castShadow = true;
            const hood = new THREE.Mesh(new THREE.SphereGeometry(0.155, 14, 14), matHoodie);
            hood.position.set(0, 1.70, -0.02); hood.castShadow = true;

            function makeArm(side) {
                const shoulder = new THREE.Group();
                shoulder.position.set(side * 0.26, 1.48, 0);
                const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.055, 0.28, 10), matHoodie);
                upper.position.y = -0.14; upper.castShadow = true;

                const elbow = new THREE.Group();
                elbow.position.y = -0.28;
                const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.045, 0.26, 10), matHoodie);
                fore.position.y = -0.13; fore.castShadow = true;
                const hand = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), matGlove);
                hand.position.y = -0.27;

                elbow.add(fore, hand);
                shoulder.add(upper, elbow);
                return { shoulder, elbow };
            }

            function makeLeg(side) {
                const hip = new THREE.Group();
                hip.position.set(side * 0.11, 0.88, 0);
                const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.085, 0.42, 10), matJeans);
                thigh.position.y = -0.21; thigh.castShadow = true;

                const knee = new THREE.Group();
                knee.position.y = -0.42;
                const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.08, 0.40, 10), matJeans);
                shin.position.y = -0.20; shin.castShadow = true;
                const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.10, 0.26), matWhite);
                shoe.position.set(0, -0.41, 0.05); shoe.castShadow = true;

                knee.add(shin, shoe);
                hip.add(thigh, knee);
                return { hip, knee };
            }

            const armL = makeArm(-1), armR = makeArm(1);
            const legL = makeLeg(-1), legR = makeLeg(1);
            root.add(torso, tee, head, hood, armL.shoulder, armR.shoulder, legL.hip, legR.hip);
            root.userData = { armL, armR, legL, legR };
            return root;
        }

        function animateHuman(mesh, walk, isAir) {
            const { armL, armR, legL, legR } = mesh.userData;
            if (isAir) {
                legL.hip.rotation.x = -0.45; legL.knee.rotation.x = 0.75;
                legR.hip.rotation.x = -0.15; legR.knee.rotation.x = 0.45;
                armL.shoulder.rotation.x = -0.25; armL.elbow.rotation.x = -0.85;
                armR.shoulder.rotation.x = 0.20;  armR.elbow.rotation.x = -0.75;
            } else if (walk > 0.01) {
                const s = Math.sin(walk);
                legL.hip.rotation.x = s * 0.48;
                legR.hip.rotation.x = -s * 0.48;
                legL.knee.rotation.x = Math.max(0, -Math.sin(walk - 0.5)) * 0.85 + 0.1;
                legR.knee.rotation.x = Math.max(0, Math.sin(walk - 0.5)) * 0.85 + 0.1;

                armL.shoulder.rotation.x = -s * 0.42;
                armR.shoulder.rotation.x = s * 0.42;
                armL.elbow.rotation.x = -(0.35 + Math.max(0, s) * 0.55);
                armR.elbow.rotation.x = -(0.35 + Math.max(0, -s) * 0.55);
            } else {
                const idle = Math.sin(Date.now() * 0.0025) * 0.03;
                legL.hip.rotation.x = 0; legL.knee.rotation.x = 0;
                legR.hip.rotation.x = 0; legR.knee.rotation.x = 0;
                armL.shoulder.rotation.x = idle; armL.elbow.rotation.x = -0.25;
                armR.shoulder.rotation.x = -idle; armR.elbow.rotation.x = -0.25;
            }
        }

        const myPlayerMesh = createHumanModel(0x1e2538);
        myPlayerMesh.position.set(-2.5, 0, 0);
        scene.add(myPlayerMesh);

        let myNick = "", started = false, chatOpen = false;
        let camYaw = 0, camPitch = 0.28, camDist = 4.5, dragging = false;
        let carMode = "none", hostNick = "", vy = 0, walkTime = 0, carSpeed = 0;
        let remoteEntities = {};
        let lastChatId = "";

        async function loginAndPlay() {
            const nick = document.getElementById('nick-input').value.trim();
            const pass = document.getElementById('pass-input').value.trim();
            const msg = document.getElementById('auth-msg');
            if (nick.length < 3 || pass.length < 3) {
                msg.innerText = "Введите ник и пароль (минимум 3 символа)!";
                return;
            }
            msg.style.color = "#c084fc";
            msg.innerText = "Проверка пароля в базе данных...";

            try {
                const res = await fetch(DB_URL + "/users/" + encodeURIComponent(nick) + ".json");
                const userData = await res.json();
                if (userData && userData.password !== pass) {
                    msg.style.color = "#f87171";
                    msg.innerText = "Неверный пароль от этого аккаунта!";
                    return;
                }
                if (!userData) {
                    await fetch(DB_URL + "/users/" + encodeURIComponent(nick) + ".json", {
                        method: 'PUT', body: JSON.stringify({ password: pass, created: Date.now() })
                    });
                }
            } catch (e) {
                msg.style.color = "#f87171";
                msg.innerText = "Ошибка сети или правил доступа БД!";
                return;
            }

            myNick = nick;
            document.getElementById('badge').innerText = "Test Server #1 • " + myNick;
            document.getElementById('launcher').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';
            started = true;
            addChat(`<span style="color:#facc15">[Сервер]: Вы вошли как ${myNick}!</span>`);
            sendChatOnline(`<span style="color:#4ade80">[Сервер]: ${myNick} подключился к серверу.</span>`);
        }
        function addChat(html) {
            const log = document.getElementById('chat-log');
            log.innerHTML += `<div>${html}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function sendChatOnline(text) {
            try {
                await fetch(DB_URL + "/chat.json", {
                    method: 'POST', body: JSON.stringify({ text: text, time: Date.now() })
                });
            } catch (e) {}
        }

        setInterval(async () => {
            if (!started || !myNick) return;
            try {
                await fetch(DB_URL + "/online/" + encodeURIComponent(myNick) + ".json", {
                    method: 'PUT',
                    body: JSON.stringify({
                        x: myPlayerMesh.position.x, y: myPlayerMesh.position.y, z: myPlayerMesh.position.z,
                        angle: myPlayerMesh.rotation.y, walk: walkTime, carMode: carMode,
                        carX: myCarMesh.position.x, carZ: myCarMesh.position.z, carAng: myCarMesh.rotation.y, ts: Date.now()
                    })
                });
                const [pRes, cRes] = await Promise.all([
                    fetch(DB_URL + "/online.json"),
                    fetch(DB_URL + "/chat.json?orderBy=\"$key\"&limitToLast=1")
                ]);
                const pData = await pRes.json() || {};
                const now = Date.now();

                for (let k of Object.keys(remoteEntities)) {
                    if (!pData[k] || now - pData[k].ts > 8000) {
                        scene.remove(remoteEntities[k].human);
                        scene.remove(remoteEntities[k].car);
                        delete remoteEntities[k];
                    }
                }

                for (let [k, v] of Object.entries(pData)) {
                    if (k === myNick || !v || now - v.ts > 8000) continue;
                    if (!remoteEntities[k]) {
                        const h = createHumanModel(0x4c1d95);
                        const c = carTemplate ? carTemplate.clone() : createFallbackCar(0x10b981);
                        scene.add(h, c);
                        remoteEntities[k] = { human: h, car: c, data: v };
                    }
                    const ent = remoteEntities[k];
                    ent.data = v;
                    ent.human.position.set(v.x, v.y, v.z);
                    ent.human.rotation.y = v.angle;
                    ent.human.visible = (v.carMode === "none");
                    animateHuman(ent.human, v.walk || 0, v.y > 0.05);

                    ent.car.position.set(v.carX, 0, v.carZ);
                    ent.car.rotation.y = v.carAng;
                }

                const cData = await cRes.json();
                if (cData) {
                    const id = Object.keys(cData).at(0);
                    if (id && id !== lastChatId) {
                        lastChatId = id;
                        addChat(cData[id].text);
                    }
                }
            } catch (e) {}
        }, 250);

        renderer.domElement.addEventListener('mousedown', () => {
            dragging = true;
            if (started && !chatOpen && renderer.domElement.requestPointerLock) renderer.domElement.requestPointerLock();
        });
        window.addEventListener('mouseup', () => { dragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!started || chatOpen) return;
            if (document.pointerLockElement === renderer.domElement || dragging) {
                camYaw -= e.movementX * 0.005;
                camPitch = Math.max(-0.05, Math.min(1.15, camPitch + e.movementY * 0.004));
            }
        });
        window.addEventListener('wheel', (e) => {
            if (started) camDist = Math.max(2.5, Math.min(15, camDist + e.deltaY * 0.005));
        });

        const keys = {};
        window.addEventListener('keydown', (e) => {
            if (!started) return;
            if (e.code === 'KeyT' && !chatOpen) {
                e.preventDefault(); chatOpen = true;
                if (document.exitPointerLock) document.exitPointerLock();
                const inp = document.getElementById('chat-input'); inp.style.display = 'block'; inp.focus();
                return;
            }
            if (chatOpen) {
                if (e.code === 'Enter') {
                    const inp = document.getElementById('chat-input'); const txt = inp.value.trim();
                    if (txt) {
                        const formatted = txt.startsWith('/me ') ? `<span style="color:#f472b6">* ${myNick} ${txt.slice(4)}</span>` : `${myNick}: ${txt}`;
                        sendChatOnline(formatted);
                    }
                    inp.value = ''; inp.style.display = 'none'; chatOpen = false;
                } else if (e.code === 'Escape') { document.getElementById('chat-input').style.display = 'none'; chatOpen = false; }
                return;
            }

            if (e.code === 'KeyF') {
                if (carMode === "none" && myPlayerMesh.position.distanceTo(myCarMesh.position) < 4.2) {
                    carMode = "driver";
                    myPlayerMesh.visible = false;
                    sendChatOnline(`<span style="color:#f472b6">* ${myNick} сел за руль автомобиля</span>`);
                } else if (carMode !== "none") {
                    carMode = "none";
                    myPlayerMesh.visible = true;
                    myPlayerMesh.position.x -= 2.2;
                    sendChatOnline(`<span style="color:#f472b6">* ${myNick} вышел из автомобиля</span>`);
                }
            }

            if (e.code === 'KeyG' && carMode === "none") {
                for (let [rNick, ent] of Object.entries(remoteEntities)) {
                    if (myPlayerMesh.position.distanceTo(ent.car.position) < 4.5) {
                        carMode = "passenger";
                        hostNick = rNick;
                        myPlayerMesh.visible = false;
                        sendChatOnline(`<span style="color:#f472b6">* ${myNick} сел пассажиром к ${rNick}</span>`);
                        break;
                    }
                }
            }

            if (e.code === 'KeyH' && carMode === "none") {
                for (let [rNick, ent] of Object.entries(remoteEntities)) {
                    if (myPlayerMesh.position.distanceTo(ent.human.position) < 3.5) {
                        sendChatOnline(`<span style="color:#f472b6">* ${myNick} пожал руку игроку ${rNick}</span>`);
                        break;
                    }
                }
            }
            keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });
        function animate() {
            requestAnimationFrame(animate);

            if (started && !chatOpen) {
                if (carMode === "none") {
                    const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw);
                    const rightX = Math.cos(camYaw), rightZ = -Math.sin(camYaw);
                    let dx = 0, dz = 0;
                    if (keys['KeyW']) { dx += fwdX; dz += fwdZ; }
                    if (keys['KeyS']) { dx -= fwdX; dz -= fwdZ; }
                    if (keys['KeyD']) { dx += rightX; dz += rightZ; }
                    if (keys['KeyA']) { dx -= rightX; dz -= rightZ; }

                    const len = Math.hypot(dx, dz);
                    if (len > 0) {
                        const spd = keys['ShiftLeft'] ? 0.18 : 0.095;
                        myPlayerMesh.position.x += (dx / len) * spd;
                        myPlayerMesh.position.z += (dz / len) * spd;
                        myPlayerMesh.rotation.y = Math.atan2(dx, dz);
                        walkTime += spd * 0.65;
                    } else walkTime = 0;

                    if (keys['Space'] && myPlayerMesh.position.y <= 0.01) vy = 0.18;
                    myPlayerMesh.position.y += vy;
                    if (myPlayerMesh.position.y > 0) vy -= 0.010;
                    else { myPlayerMesh.position.y = 0; vy = 0; }

                    animateHuman(myPlayerMesh, walkTime, myPlayerMesh.position.y > 0.05);
                } else if (carMode === "driver") {
                    if (keys['KeyW']) carSpeed = Math.min(carSpeed + 0.018, 0.75);
                    else if (keys['KeyS']) carSpeed = Math.max(carSpeed - 0.018, -0.35);
                    else carSpeed *= 0.96;

                    if (Math.abs(carSpeed) > 0.01) {
                        const dir = carSpeed > 0 ? 1 : -1;
                        if (keys['KeyA']) myCarMesh.rotation.y += 0.04 * dir;
                        if (keys['KeyD']) myCarMesh.rotation.y -= 0.04 * dir;
                    }
                    myCarMesh.position.x += Math.sin(myCarMesh.rotation.y) * carSpeed;
                    myCarMesh.position.z += Math.cos(myCarMesh.rotation.y) * carSpeed;
                    myPlayerMesh.position.copy(myCarMesh.position);
                } else if (carMode === "passenger") {
                    const host = remoteEntities[hostNick];
                    if (host) {
                        myPlayerMesh.position.copy(host.car.position);
                    } else { carMode = "none"; myPlayerMesh.visible = true; }
                }
            }

            const targetPos = carMode === "driver" ? myCarMesh.position : myPlayerMesh.position;
            const ty = carMode !== "none" ? 1.1 : targetPos.y + 1.35;
            const d = carMode !== "none" ? camDist + 2.5 : camDist;
            camera.position.set(
                targetPos.x + Math.sin(camYaw) * Math.cos(camPitch) * d,
                ty + Math.sin(camPitch) * d,
                targetPos.z + Math.cos(camYaw) * Math.cos(camPitch) * d
            );
            camera.lookAt(targetPos.x, ty, targetPos.z);

            const labels = document.getElementById('labels-layer');
            labels.innerHTML = "";
            for (let [rNick, ent] of Object.entries(remoteEntities)) {
                const headVec = ent.human.position.clone();
                headVec.y += 2.15;
                headVec.project(camera);
                if (headVec.z < 1) {
                    const tag = document.createElement('div');
                    tag.className = 'player-tag';
                    tag.style.left = (headVec.x * 0.5 + 0.5) * window.innerWidth + 'px';
                    tag.style.top = (-headVec.y * 0.5 + 0.5) * window.innerHeight + 'px';
                    tag.innerText = rNick + (ent.data.carMode === "driver" ? " [За рулём]" : "");
                    labels.appendChild(tag);
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
