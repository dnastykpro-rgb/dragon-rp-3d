<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dragon RP — Mobile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif;user-select:none;touch-action:none}
body{overflow:hidden;background:#0f172a}canvas{display:block;width:100vw;height:100vh}
.scr{position:fixed;inset:0;z-index:100;background:radial-gradient(circle,#1e293b 0%,#090d16 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:20px;text-align:center}
.scr.off{display:none}
.card{width:100%;max-width:340px;background:rgba(15,23,42,.88);border:1px solid rgba(56,189,248,.35);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 35px rgba(0,0,0,.6)}
h1{color:#38bdf8;font-size:26px;letter-spacing:1.5px;text-transform:uppercase}
p{color:#94a3b8;font-size:12.5px}
input.fld{width:100%;background:#0f172a;border:1px solid #38bdf8;color:#fff;padding:11px 12px;border-radius:10px;font-size:14px;outline:none;touch-action:auto}
.btn{background:linear-gradient(135deg,#0284c7,#2563eb);color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer}
.btn.sec{background:#1e293b;border:1px solid #38bdf8;color:#38bdf8}
.err{color:#f87171;font-size:12px;min-height:16px}

#hud{position:fixed;inset:0;pointer-events:none;display:none}
#chat-wrap{position:fixed;top:10px;left:10px;width:215px;background:rgba(10,15,25,.38);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:6px;pointer-events:auto;z-index:30;backdrop-filter:blur(2px)}
#chat-wrap.min #chat-log,#chat-wrap.min #chat-row{display:none}
#chat-log{height:52px;overflow-y:auto;font-size:10.5px;color:#f8fafc;display:flex;flex-direction:column;gap:2px;margin-bottom:4px;text-shadow:0 1px 2px #000}
#chat-row{display:flex;gap:4px}
#chat-in{flex:1;min-width:0;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:11px;padding:4px 6px;border-radius:6px;outline:none;touch-action:auto}
#chat-ent{background:#0284c7;color:#fff;border:none;padding:4px 8px;border-radius:6px;font-size:10.5px;font-weight:bold;cursor:pointer}
#top-right{position:fixed;top:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:auto;z-index:30}
.pill{background:rgba(15,23,42,.78);color:#38bdf8;border:1px solid rgba(56,189,248,.35);padding:7px 12px;border-radius:12px;font-size:12px;font-weight:bold;cursor:pointer}
.pill.exit{color:#f87171;border-color:rgba(248,113,113,.45)}

#joy-zone{position:fixed;left:22px;bottom:22px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(56,189,248,.4);pointer-events:auto;z-index:30}
#joy-stick{position:absolute;left:35px;top:35px;width:42px;height:42px;border-radius:50%;background:rgba(56,189,248,.8)}

#btn-chat-tog{position:fixed;left:152px;bottom:24px;width:48px;height:48px;border-radius:50%;background:rgba(15,23,42,.82);color:#38bdf8;border:1.5px solid #38bdf8;font-size:11px;font-weight:bold;pointer-events:auto;z-index:30}
#btn-car{display:none;position:fixed;right:24px;bottom:164px;padding:10px 16px;border-radius:12px;background:rgba(14,165,233,.92);color:#fff;border:none;font-size:12px;font-weight:900;pointer-events:auto;z-index:30}
#btn-car.show{display:block}
#btn-jump{position:fixed;right:104px;bottom:30px;width:58px;height:58px;border-radius:50%;background:rgba(15,23,42,.85);color:#fff;border:2px solid rgba(255,255,255,.28);font-size:11px;font-weight:800;pointer-events:auto;z-index:30}
#btn-run{position:fixed;right:22px;bottom:84px;width:66px;height:66px;border-radius:50%;background:rgba(2,132,199,.88);color:#fff;border:2px solid #38bdf8;font-size:12px;font-weight:900;pointer-events:auto;z-index:30}
#btn-jump:active,#btn-run:active{transform:scale(.93);background:#38bdf8;color:#090d16}
</style>
</head>
<body>
<div id="scr-nick" class="scr">
<h1>Dragon RP</h1>
<div class="card">
<p>Введите игровой никнейм</p>
<input id="inp-nick" class="fld" placeholder="Например: Ivan_Ivanov" maxlength="20">
<div class="err" id="err-nick"></div>
<button class="btn" onclick="goAuthScreen()">ИГРАТЬ</button>
</div>
</div>

<div id="scr-auth" class="scr off">
<h1 id="auth-title">Авторизация</h1>
<div class="card">
<p id="auth-sub">Войдите или зарегистрируйте аккаунт</p>
<input id="inp-pass" class="fld" type="password" placeholder="Пароль" maxlength="24">
<div class="err" id="err-auth"></div>
<button class="btn" onclick="submitAuth(false)">ВОЙТИ</button>
<button class="btn sec" onclick="submitAuth(true)">РЕГИСТРАЦИЯ</button>
<button class="btn sec" style="border-color:#64748b;color:#94a3b8" onclick="backToNick()">СМЕНИТЬ НИК</button>
</div>
</div>

<div id="hud">
<div id="chat-wrap">
<div id="chat-log"></div>
<div id="chat-row">
<input id="chat-in" placeholder="Сообщение..." maxlength="70">
<button id="chat-ent" onclick="sendChat()">Enter</button>
</div>
</div>

<div id="top-right">
<div class="pill" id="hud-stat">₽ 5 000</div>
<button class="pill exit" onclick="exitToMainMenu()">В Меню</button>
</div>

<div id="joy-zone"><div id="joy-stick"></div></div>
<button id="btn-chat-tog" onclick="toggleChat()">ЧАТ</button>
<button id="btn-car" onclick="toggleVehicle()">СЕСТЬ В АВТО</button>
<button id="btn-jump" onclick="doJump()">ПРЫЖОК</button>
<button id="btn-run" ontouchstart="runHold=true" ontouchend="runHold=false" onmousedown="runHold=true" onmouseup="runHold=false">БЕГ</button>
</div>

<script src="./three.min.js"></script>
<script src="./GLTFLoader.js"></script>
<script>
const DB = "https://firebaseio.com";
let playerNick = localStorage.getItem("drp_last_nick") || "";
let playerMoney = 5000, inGame = false, inCar = false, runHold = false;
document.getElementById("inp-nick").value = playerNick;

function goAuthScreen() {
    const val = document.getElementById("inp-nick").value.trim();
    if (val.length < 3) { document.getElementById("err-nick").innerText = "Минимум 3 символа"; return; }
    playerNick = val;
    localStorage.setItem("drp_last_nick", val);
    document.getElementById("err-nick").innerText = "";
    document.getElementById("auth-title").innerText = playerNick;
    document.getElementById("scr-nick").classList.add("off");
    document.getElementById("scr-auth").classList.remove("off");
}

function backToNick() {
    document.getElementById("scr-auth").classList.add("off");
    document.getElementById("scr-nick").classList.remove("off");
}
async function submitAuth(isReg) {
    const pass = document.getElementById("inp-pass").value.trim();
    const errEl = document.getElementById("err-auth");
    if (pass.length < 4) { errEl.innerText = "Пароль от 4 символов"; return; }
    errEl.innerText = "Подключение к базе...";

    const cleanKey = playerNick.toLowerCase().replace(/[^a-z0-9_]/g, "_");
    const localKey = "drp_acc_" + cleanKey;

    try {
        const res = await fetch(`${DB}/dragon_users/${cleanKey}.json`);
        const remote = await res.json();

        if (isReg) {
            if (remote) { errEl.innerText = "Ник занят! Нажмите ВОЙТИ"; return; }
            const data = { nick: playerNick, pass, money: 5000 };
            await fetch(`${DB}/dragon_users/${cleanKey}.json`, { method: "PUT", body: JSON.stringify(data) });
            localStorage.setItem(localKey, JSON.stringify(data));
            playerMoney = 5000;
        } else {
            const local = JSON.parse(localStorage.getItem(localKey) || "null");
            const acc = remote || local;
            if (!acc) { errEl.innerText = "Аккаунт не найден. Нажмите РЕГИСТРАЦИЯ"; return; }
            if (acc.pass !== pass) { errEl.innerText = "Неверный пароль!"; return; }
            playerMoney = acc.money || 5000;
        }
    } catch (e) {
        const local = JSON.parse(localStorage.getItem(localKey) || "null");
        if (isReg) {
            localStorage.setItem(localKey, JSON.stringify({ nick: playerNick, pass, money: 5000 }));
            playerMoney = 5000;
        } else if (local && local.pass === pass) {
            playerMoney = local.money || 5000;
        } else {
            errEl.innerText = "Проверьте пароль или нажмите РЕГИСТРАЦИЯ";
            return;
        }
    }

    errEl.innerText = "";
    document.getElementById("inp-pass").value = "";
    startGameWorld();
}

let chatStream = null;
function startGameWorld() {
    document.getElementById("scr-auth").classList.add("off");
    document.getElementById("hud").style.display = "block";
    document.getElementById("hud-stat").innerText = `₽ ${playerMoney}`;
    inGame = true;
    addChat(`Добро пожаловать в Dragon RP, ${playerNick}!`, "#38bdf8");
    connectOnlineServices();
}

function exitToMainMenu() {
    inGame = false;
    inCar = false;
    if (chatStream) { chatStream.close(); chatStream = null; }
    document.getElementById("hud").style.display = "none";
    document.getElementById("scr-auth").classList.add("off");
    document.getElementById("scr-nick").classList.remove("off");
}

function toggleChat() { document.getElementById("chat-wrap").classList.toggle("min"); }

function addChat(txt, col = "#f8fafc") {
    const log = document.getElementById("chat-log");
    const d = document.createElement("div");
    d.style.color = col; d.innerText = txt;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
}

function sendChat() {
    const inp = document.getElementById("chat-in");
    const t = inp.value.trim();
    if (!t) return;
    inp.value = "";
    addChat(`${playerNick}: ${t}`);
    fetch(`${DB}/dragon_chat.json`, {
        method: "POST",
        body: JSON.stringify({ n: playerNick, t, ts: Date.now() })
    }).catch(() => {});
}
document.getElementById("chat-in").addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 35, 160);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(30, 50, 25);
sun.castShadow = true;
scene.add(sun, new THREE.AmbientLight(0xffffff, 0.55));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 300), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.02; road.receiveShadow = true;
scene.add(ground, road);

for (let z = -120; z <= 120; z += 30) {
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(16, 18 + Math.abs(z % 12), 18), new THREE.MeshStandardMaterial({ color: 0x475569 }));
    b1.position.set(-18, 9, z); b1.castShadow = true; b1.receiveShadow = true;
    const b2 = b1.clone(); b2.position.x = 18;
    scene.add(b1, b2);
}
const loader = new THREE.GLTFLoader();
const playerObj = new THREE.Group();
playerObj.position.set(-3, 0, 5);
scene.add(playerObj);
let charBones = {}, walkCycle = 0;

loader.load("./skin_man.glb", (gltf) => {
    const m = gltf.scene;
    m.traverse((n) => {
        if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; n.frustumCulled = false; }
        if (n.isBone) charBones[n.name] = n;
    });
    const box = new THREE.Box3().setFromObject(m);
    m.position.y = -box.min.y;
    playerObj.add(m);
});

const bmwObj = new THREE.Group();
bmwObj.position.set(2.5, 0, -4);
scene.add(bmwObj);

loader.load("./bmw_m5.glb", (gltf) => {
    const m = gltf.scene;
    m.traverse((n) => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
    const box = new THREE.Box3().setFromObject(m);
    const sz = new THREE.Vector3(), ct = new THREE.Vector3();
    box.getSize(sz); box.getCenter(ct);
    const sc = 4.8 / Math.max(sz.x, sz.y, sz.z);
    m.scale.setScalar(sc);
    m.position.set(-ct.x * sc, -box.min.y * sc, -ct.z * sc);
    bmwObj.add(m);
});
const remotePlayers = {};
let playerStream = null;

function spawnRemoteSkin(id) {
    const grp = new THREE.Group();
    scene.add(grp);
    loader.load("./skin_man.glb", (gltf) => {
        const m = gltf.scene;
        m.traverse((n) => { if (n.isMesh) { n.castShadow = true; n.frustumCulled = false; } });
        const box = new THREE.Box3().setFromObject(m);
        m.position.y = -box.min.y;
        grp.add(m);
    });
    remotePlayers.id = grp;
    return grp;
}

function connectOnlineServices() {
    if (chatStream) chatStream.close();
    chatStream = new EventSource(`${DB}/dragon_chat.json`);
    chatStream.addEventListener("put", (e) => {
        const msg = JSON.parse(e.data);
        if (!msg || !msg.data) return;
        const vals = Object.values(msg.data).slice(-6);
        vals.forEach((v) => { if (v && v.n && v.n !== playerNick && Date.now() - (v.ts || 0) < 30000) addChat(`${v.n}: ${v.t}`, "#7dd3fc"); });
    });
    chatStream.addEventListener("patch", (e) => {
        const msg = JSON.parse(e.data);
        if (!msg || !msg.data) return;
        Object.values(msg.data).forEach((v) => { if (v && v.n && v.n !== playerNick) addChat(`${v.n}: ${v.t}`, "#7dd3fc"); });
    });

    if (playerStream) playerStream.close();
    playerStream = new EventSource(`${DB}/dragon_players.json`);
    const updPlayers = (data) => {
        if (!data) return;
        const myKey = playerNick.toLowerCase().replace(/[^a-z0-9_]/g, "_");
        for (let [k, v] of Object.entries(data)) {
            if (k === myKey || !v || v.x === undefined) continue;
            if (!remotePlayers.k) remotePlayers.k = spawnRemoteSkin(k);
            remotePlayers.k.position.set(v.x, v.y || 0, v.z);
            remotePlayers.k.rotation.y = v.ry || 0;
        }
    };
    playerStream.addEventListener("put", (e) => { const m = JSON.parse(e.data); if (m) updPlayers(m.data); });
    playerStream.addEventListener("patch", (e) => { const m = JSON.parse(e.data); if (m) updPlayers(m.data); });
}

setInterval(() => {
    if (!inGame || !playerNick) return;
    const myKey = playerNick.toLowerCase().replace(/[^a-z0-9_]/g, "_");
    const pos = inCar ? bmwObj.position : playerObj.position;
    const rot = inCar ? bmwObj.rotation.y : playerObj.rotation.y;
    fetch(`${DB}/dragon_players/${myKey}.json`, {
        method: "PUT",
        body: JSON.stringify({ x: pos.x, y: pos.y, z: pos.z, ry: rot, ts: Date.now() })
    }).catch(() => {});
}, 180);
let joyX = 0, joyY = 0, joyId = null, camYaw = 0, camPitch = 0.25, lookId = null, lx = 0, ly = 0;
let velY = 0, grounded = true, carSpeed = 0;

const jz = document.getElementById("joy-zone"), js = document.getElementById("joy-stick");
jz.addEventListener("touchstart", (e) => { const t = e.changedTouches.item(0); joyId = t.identifier; moveJoy(t); });
jz.addEventListener("touchmove", (e) => { for (let i = 0; i < e.changedTouches.length; i++) { const t = e.changedTouches.item(i); if (t.identifier === joyId) moveJoy(t); } });
jz.addEventListener("touchend", (e) => { for (let i = 0; i < e.changedTouches.length; i++) { if (e.changedTouches.item(i).identifier === joyId) { joyId = null; joyX = joyY = 0; js.style.transform = "translate(0,0)"; } } });
function moveJoy(t) {
    const r = jz.getBoundingClientRect(), dx = t.clientX - (r.left + 58), dy = t.clientY - (r.top + 58);
    const d = Math.min(36, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    joyX = Math.cos(a) * (d / 36); joyY = Math.sin(a) * (d / 36);
    js.style.transform = `translate(${joyX * 36}px,${joyY * 36}px)`;
}

renderer.domElement.addEventListener("touchstart", (e) => { const t = e.changedTouches.item(0); lookId = t.identifier; lx = t.clientX; ly = t.clientY; });
renderer.domElement.addEventListener("touchmove", (e) => { for (let i = 0; i < e.changedTouches.length; i++) { const t = e.changedTouches.item(i); if (t.identifier === lookId) { camYaw -= (t.clientX - lx) * 0.007; camPitch = Math.max(0.05, Math.min(1.1, camPitch + (t.clientY - ly) * 0.005)); lx = t.clientX; ly = t.clientY; } } });
renderer.domElement.addEventListener("touchend", (e) => { for (let i = 0; i < e.changedTouches.length; i++) { if (e.changedTouches.item(i).identifier === lookId) lookId = null; } });

function doJump() {
    if (inCar) { carSpeed *= 0.5; return; }
    if (grounded) { velY = 0.22; grounded = false; }
}

function toggleVehicle() {
    if (!inCar && playerObj.position.distanceTo(bmwObj.position) < 4.5) {
        inCar = true; playerObj.visible = false;
        document.getElementById("btn-car").innerText = "ВЫЙТИ ИЗ АВТО";
        document.getElementById("btn-run").innerText = "ГАЗ";
        document.getElementById("btn-jump").innerText = "ТОРМОЗ";
        addChat("Вы сели в BMW M5 CS (F90)", "#38bdf8");
    } else if (inCar) {
        inCar = false; carSpeed = 0; playerObj.visible = true;
        playerObj.position.set(bmwObj.position.x - 2.2, 0, bmwObj.position.z);
        document.getElementById("btn-car").innerText = "СЕСТЬ В АВТО";
        document.getElementById("btn-run").innerText = "БЕГ";
        document.getElementById("btn-jump").innerText = "ПРЫЖОК";
    }
}

function animate() {
    requestAnimationFrame(animate);
    if (!inGame) { renderer.render(scene, camera); return; }

    const nearCar = playerObj.position.distanceTo(bmwObj.position) < 4.5;
    document.getElementById("btn-car").classList.toggle("show", inCar || nearCar);

    if (inCar) {
        if (runHold) carSpeed = Math.min(0.55, carSpeed + 0.012);
        else if (joyY > 0.2) carSpeed = Math.max(-0.22, carSpeed - 0.01);
        else carSpeed *= 0.96;

        if (Math.abs(carSpeed) > 0.01) bmwObj.rotation.y -= joyX * 0.035 * Math.sign(carSpeed);
        bmwObj.position.x += Math.sin(bmwObj.rotation.y) * carSpeed;
        bmwObj.position.z += Math.cos(bmwObj.rotation.y) * carSpeed;

        const target = bmwObj.position;
        camera.position.set(target.x - Math.sin(camYaw) * 6.5, 2.6 + camPitch * 3, target.z - Math.cos(camYaw) * 6.5);
        camera.lookAt(target.x, 1.2, target.z);
    } else {
        const moving = Math.hypot(joyX, joyY) > 0.1;
        const spd = moving ? (runHold ? 0.16 : 0.08) : 0;

        if (moving) {
            const moveAngle = camYaw + Math.atan2(-joyX, -joyY);
            playerObj.rotation.y = moveAngle;
            playerObj.position.x += Math.sin(moveAngle) * spd;
            playerObj.position.z += Math.cos(moveAngle) * spd;

            walkCycle += runHold ? 0.22 : 0.14;
            const sw = Math.sin(walkCycle) * (runHold ? 0.65 : 0.42);
            if (charBones.Fbx01_L_Thigh_010) charBones.Fbx01_L_Thigh_010.rotation.z = sw;
            if (charBones.Fbx01_R_Thigh_05) charBones.Fbx01_R_Thigh_05.rotation.z = -sw;
            if (charBones.Fbx01_L_UpperArm_048) charBones.Fbx01_L_UpperArm_048.rotation.y = -sw * 0.6;
            if (charBones.Fbx01_R_UpperArm_024) charBones.Fbx01_R_UpperArm_024.rotation.y = sw * 0.6;
        } else if (charBones.Fbx01_L_Thigh_010) {
            charBones.Fbx01_L_Thigh_010.rotation.z *= 0.85;
            charBones.Fbx01_R_Thigh_05.rotation.z *= 0.85;
        }

        playerObj.position.y += velY;
        if (playerObj.position.y > 0) velY -= 0.012;
        else { playerObj.position.y = 0; velY = 0; grounded = true; }

        const p = playerObj.position;
        camera.position.set(p.x - Math.sin(camYaw) * 4.2, p.y + 1.8 + camPitch * 2.5, p.z - Math.cos(camYaw) * 4.2);
        camera.lookAt(p.x, p.y + 1.3, p.z);
    }

    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
