<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Test Server 3D Online</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { overflow: hidden; background: #0b0f19; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }

        #launcher {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            transition: opacity 0.4s ease;
        }
        #launcher.hidden { opacity: 0; pointer-events: none; }

        .auth-panel {
            position: absolute; top: 28px; left: 28px;
            background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 18px; padding: 18px 20px; width: 300px;
        }
        .auth-panel label { display: block; font-size: 11px; color: #c084fc; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
        .auth-panel input {
            width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 10px;
            padding: 10px 12px; color: white; font-size: 14px; outline: none; margin-bottom: 12px;
        }
        .auth-panel input:focus { border-color: #a855f7; }
        #auth-msg { color: #f87171; font-size: 12px; min-height: 16px; }
        .play-panel {
            position: absolute; bottom: 28px; right: 28px;
            display: flex; align-items: center; gap: 12px;
            background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 12px 16px;
        }
        .play-panel select {
            background: #1e293b; color: white; border: 1px solid #334155;
            padding: 14px 16px; border-radius: 12px; font-size: 15px; font-weight: 600; outline: none;
        }
        .play-panel button {
            background: linear-gradient(135deg, #9333ea, #4f46e5); color: white; border: none;
            padding: 14px 34px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer;
        }
        .play-panel button:hover { filter: brightness(1.15); }

        #hud { display: none; position: fixed; inset: 0; pointer-events: none; }
        #badge {
            position: absolute; top: 20px; right: 20px; background: rgba(15, 23, 42, 0.78);
            color: #c084fc; padding: 10px 16px; border-radius: 12px; font-weight: bold; font-size: 14px;
        }
        #chat-box { position: absolute; top: 20px; left: 20px; width: 410px; pointer-events: auto; }
        #chat-log {
            background: rgba(15, 23, 42, 0.68); border-radius: 14px; padding: 12px;
            height: 170px; overflow-y: auto; color: white; font-size: 13px; line-height: 1.45;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        #chat-input {
            display: none; width: 100%; margin-top: 6px; padding: 10px 14px; border-radius: 10px;
            border: 1px solid #a855f7; background: #0f172a; color: white; font-size: 14px; outline: none;
        }
        #hint {
            position: absolute; bottom: 20px; left: 20px; background: rgba(15, 23, 42, 0.78);
            color: #e2e8f0; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.6;
        }
        #labels-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .player-tag {
            position: absolute; transform: translate(-50%, -100%);
            background: rgba(0,0,0,0.6); color: white; padding: 3px 8px; border-radius: 6px;
            font-size: 12px; font-weight: bold; white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="launcher">
        <div class="auth-panel">
            <label>Игровой ник</label>
            <input type="text" id="nick-input" placeholder="Например: Domik_Brane" maxlength="20">
            <label>Пароль от аккаунта</label>
            <input type="password" id="pass-input" placeholder="Придумайте или введите пароль" maxlength="32">
            <div id="auth-msg"></div>
        </div>
        <div class="play-panel">
            <select id="server-select">
                <option value="Test Server #1">Test Server #1 (Онлайн)</option>
            </select>
            <button onclick="loginAndPlay()">ВОЙТИ В ИГРУ</button>
        </div>
    </div>

    <div id="labels-layer"></div>

    <div id="hud">
        <div id="badge">Test Server #1</div>
        <div id="chat-box">
            <div id="chat-log"></div>
            <input type="text" id="chat-input" placeholder="Написать в чат или /me...">
        </div>
        <div id="hint">
            <b>WASD</b> — Движение | <b>Shift</b> — Бег | <b>Пробел</b> — Прыжок | <b>T</b> — Чат<br>
            <b>F</b> — Сесть за руль | <b>G</b> — Пассажиром к игроку | <b>H</b> — Пожать руку
        </div>
    </div>

    <canvas id="glCanvas"></canvas>
    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl');
        let W, H;
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; gl.viewport(0, 0, W, H); }
        window.addEventListener('resize', resize);
        resize();

        const vs = `
            attribute vec3 aPos, aNorm; attribute vec2 aUV;
            uniform mat4 uProj, uView, uModel; uniform vec2 uUVScale;
            varying vec3 vNorm; varying vec2 vUV;
            void main() {
                gl_Position = uProj * uView * uModel * vec4(aPos, 1.0);
                vNorm = mat3(uModel) * aNorm; vUV = aUV * uUVScale;
            }
        `;
        const fs = `
            precision mediump float;
            varying vec3 vNorm; varying vec2 vUV;
            uniform sampler2D uTex; uniform vec3 uTint;
            void main() {
                vec3 sun = normalize(vec3(0.4, 0.9, 0.3));
                float light = max(dot(normalize(vNorm), sun), 0.0) * 0.6 + 0.45;
                gl_FragColor = vec4(texture2D(uTex, vUV).rgb * uTint * light, 1.0);
            }
        `;
        function makeShader(t, s) { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; }
        const prog = gl.createProgram();
        gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, vs));
        gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(prog); gl.useProgram(prog); gl.enable(gl.DEPTH_TEST);

        function createTex(grid) {
            const c = document.createElement('canvas'); c.width = 128; c.height = 128;
            const g = c.getContext('2d');
            if (grid) {
                g.fillStyle = '#334155'; g.fillRect(0, 0, 128, 128);
                g.fillStyle = '#3b4a61'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
                g.strokeStyle = 'rgba(255,255,255,0.15)'; g.strokeRect(0, 0, 128, 128);
            } else { g.fillStyle = '#ffffff'; g.fillRect(0, 0, 128, 128); }
            const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
            gl.generateMipmap(gl.TEXTURE_2D);
            return t;
        }
        const texGrid = createTex(true), texSolid = createTex(false);

        const boxData = new Float32Array([
            -0.5,-0.5,0.5,0,0,1,0,1, 0.5,-0.5,0.5,0,0,1,1,1, 0.5,0.5,0.5,0,0,1,1,0, -0.5,-0.5,0.5,0,0,1,0,1, 0.5,0.5,0.5,0,0,1,1,0, -0.5,0.5,0.5,0,0,1,0,0,
            0.5,-0.5,-0.5,0,0,-1,0,1, -0.5,-0.5,-0.5,0,0,-1,1,1, -0.5,0.5,-0.5,0,0,-1,1,0, 0.5,-0.5,-0.5,0,0,-1,0,1, -0.5,0.5,-0.5,0,0,-1,1,0, 0.5,0.5,-0.5,0,0,-1,0,0,
            -0.5,0.5,0.5,0,1,0,0,1, 0.5,0.5,0.5,0,1,0,1,1, 0.5,0.5,-0.5,0,1,0,1,0, -0.5,0.5,0.5,0,1,0,0,1, 0.5,0.5,-0.5,0,1,0,1,0, -0.5,0.5,-0.5,0,1,0,0,0,
            -0.5,-0.5,-0.5,0,-1,0,0,1, 0.5,-0.5,-0.5,0,-1,0,1,1, 0.5,-0.5,0.5,0,-1,0,1,0, -0.5,-0.5,-0.5,0,-1,0,0,1, 0.5,-0.5,0.5,0,-1,0,1,0, -0.5,-0.5,0.5,0,-1,0,0,0,
            0.5,-0.5,0.5,1,0,0,0,1, 0.5,-0.5,-0.5,1,0,0,1,1, 0.5,0.5,-0.5,1,0,0,1,0, 0.5,-0.5,0.5,1,0,0,0,1, 0.5,0.5,-0.5,1,0,0,1,0, 0.5,0.5,0.5,1,0,0,0,0,
            -0.5,-0.5,-0.5,-1,0,0,0,1, -0.5,-0.5,0.5,-1,0,0,1,1, -0.5,0.5,0.5,-1,0,0,1,0, -0.5,-0.5,-0.5,-1,0,0,0,1, -0.5,0.5,0.5,-1,0,0,1,0, -0.5,0.5,-0.5,-1,0,0,0,0
        ]);
        const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, boxData, gl.STATIC_DRAW);

        const sphereVerts = [];
        for (let lat = 0; lat < 10; lat++) {
            const t1 = lat * Math.PI / 10, t2 = (lat + 1) * Math.PI / 10;
            for (let lon = 0; lon < 14; lon++) {
                const p1 = lon * 2 * Math.PI / 14, p2 = (lon + 1) * 2 * Math.PI / 14;
                const pt = (t, p) => [Math.sin(t)*Math.cos(p), Math.cos(t), Math.sin(t)*Math.sin(p)];
                const a = pt(t1, p1), b = pt(t2, p1), c = pt(t2, p2), d = pt(t1, p2);
                [a, b, c, a, c, d].forEach(v => sphereVerts.push(v.at(0)*0.5, v.at(1)*0.5, v.at(2)*0.5, v.at(0), v.at(1), v.at(2), 0.5, 0.5));
            }
        }
        const sphereVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, sphereVbo); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(sphereVerts), gl.STATIC_DRAW);
        const aPos = gl.getAttribLocation(prog, 'aPos'), aNorm = gl.getAttribLocation(prog, 'aNorm'), aUV = gl.getAttribLocation(prog, 'aUV');
        gl.enableVertexAttribArray(aPos); gl.enableVertexAttribArray(aNorm); gl.enableVertexAttribArray(aUV);
        const uProj = gl.getUniformLocation(prog, 'uProj'), uView = gl.getUniformLocation(prog, 'uView'), uModel = gl.getUniformLocation(prog, 'uModel'), uUVScale = gl.getUniformLocation(prog, 'uUVScale'), uTint = gl.getUniformLocation(prog, 'uTint');

        function drawBox(x, y, z, sx, sy, sz, rotY, tex, r, g, b, uv = 1) {
            gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
            gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 32, 0); gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 32, 12); gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 32, 24);
            const c = Math.cos(rotY), s = Math.sin(rotY);
            gl.uniformMatrix4fv(uModel, false, new Float32Array([sx*c,0,-sx*s,0, 0,sy,0,0, sz*s,0,sz*c,0, x,y,z,1]));
            gl.uniform2f(uUVScale, uv, uv); gl.uniform3f(uTint, r, g, b); gl.bindTexture(gl.TEXTURE_2D, tex); gl.drawArrays(gl.TRIANGLES, 0, 36);
        }

        function drawPart(x, y, z, sx, sy, sz, rotY, rotX, r, g, b) {
            gl.bindBuffer(gl.ARRAY_BUFFER, sphereVbo);
            gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 32, 0); gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 32, 12); gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 32, 24);
            const cy = Math.cos(rotY), sy_ = Math.sin(rotY), cx = Math.cos(rotX), sx_ = Math.sin(rotX);
            gl.uniformMatrix4fv(uModel, false, new Float32Array([sx*cy,0,-sx*sy_,0, sy*sy_*sx_,sy*cx,sy*cy*sx_,0, sz*sy_*cx,-sz*sx_,sz*cy*cx,0, x,y,z,1]));
            gl.uniform2f(uUVScale, 1, 1); gl.uniform3f(uTint, r, g, b); gl.bindTexture(gl.TEXTURE_2D, texSolid); gl.drawArrays(gl.TRIANGLES, 0, sphereVerts.length / 8);
        }

        function drawDetailedCar(cx, cz, ang, r, g, b) {
            const c = Math.cos(ang), s = Math.sin(ang);
            const put = (ox, oy, oz, sx, sy, sz, cr, cg, cb) => {
                drawBox(cx + ox*c + oz*s, oy, cz - ox*s + oz*c, sx, sy, sz, ang, texSolid, cr, cg, cb);
            };
            put(0, 0.45, 0, 2.05, 0.42, 4.5, r, g, b);
            put(0, 0.68, 1.45, 1.95, 0.25, 1.4, r*0.95, g*0.95, b*0.95);
            put(0, 0.70, -1.6, 1.95, 0.28, 1.1, r*0.95, g*0.95, b*0.95);
            put(0, 1.05, -0.15, 1.68, 0.52, 2.0, 0.08, 0.11, 0.16);
            put(0, 1.32, -0.15, 1.62, 0.08, 1.85, r, g, b);
            put(0, 0.96, -2.05, 1.85, 0.07, 0.28, 0.1, 0.1, 0.12);
            put(0, 0.35, 2.28, 2.08, 0.24, 0.16, 0.12, 0.12, 0.14);
            put(-0.68, 0.58, 2.26, 0.42, 0.16, 0.08, 1.0, 0.96, 0.75);
            put(0.68, 0.58, 2.26, 0.42, 0.16, 0.08, 1.0, 0.96, 0.75);
            put(-0.68, 0.62, -2.26, 0.45, 0.15, 0.08, 0.95, 0.12, 0.12);
            put(0.68, 0.62, -2.26, 0.45, 0.15, 0.08, 0.95, 0.12, 0.12);
            [-0.98, 0.98].forEach(wx => [-1.35, 1.35].forEach(wz => {
                put(wx, 0.36, wz, 0.32, 0.72, 0.72, 0.08, 0.08, 0.09);
                put(wx * 1.04, 0.36, wz, 0.1, 0.42, 0.42, 0.75, 0.78, 0.82);
            }));
        }
        const DB_URL = "https://" + "test-83342-default-rtdb" + ".firebaseio.com";

        let myNick = "", started = false, chatOpen = false;
        let camYaw = 0, camPitch = 0.25, camDist = 4.2, dragging = false;
        let carMode = "none";
        let hostNick = "";
        let lastProj = null, lastView = null;

        const player = { x: -2.5, y: 0, z: 0, vy: 0, angle: Math.PI, walk: 0 };
        const myCar = { x: 2.5, z: 0, angle: Math.PI, speed: 0 };
        let remotePlayers = {};
        let lastChatId = "";

        async function loginAndPlay() {
            const nick = document.getElementById('nick-input').value.trim();
            const pass = document.getElementById('pass-input').value.trim();
            const msg = document.getElementById('auth-msg');

            if (nick.length < 3 || pass.length < 3) {
                msg.style.color = "#f87171";
                msg.innerText = "Введите ник и пароль (минимум 3 символа)!";
                return;
            }
            msg.style.color = "#c084fc";
            msg.innerText = "Проверка пароля в базе данных...";

            try {
                const res = await fetch(DB_URL + "/users/" + encodeURIComponent(nick) + ".json");
                const userData = await res.json();

                if (userData && userData.password !== pass) {
                    msg.style.color = "#f87171";
                    msg.innerText = "Неверный пароль от этого аккаунта!";
                    return;
                }
                if (!userData) {
                    await fetch(DB_URL + "/users/" + encodeURIComponent(nick) + ".json", {
                        method: 'PUT', body: JSON.stringify({ password: pass, created: Date.now() })
                    });
                }
            } catch (e) {
                msg.style.color = "#f87171";
                msg.innerText = "Ошибка сети или правил доступа БД!";
                return;
            }

            myNick = nick;
            document.getElementById('badge').innerText = "Test Server #1 • " + myNick;
            document.getElementById('launcher').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';
            started = true;
            addChat(`<span style="color:#facc15">[Сервер]: Вы вошли как ${myNick}!</span>`);
            sendChatOnline(`<span style="color:#4ade80">[Сервер]: ${myNick} подключился к серверу.</span>`);
        }

        function addChat(html) {
            const log = document.getElementById('chat-log');
            log.innerHTML += `<div>${html}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function sendChatOnline(text) {
            try {
                await fetch(DB_URL + "/chat.json", {
                    method: 'POST', body: JSON.stringify({ text: text, time: Date.now() })
                });
            } catch (e) {}
        }

        setInterval(async () => {
            if (!started || !myNick) return;
            try {
                await fetch(DB_URL + "/online/" + encodeURIComponent(myNick) + ".json", {
                    method: 'PUT',
                    body: JSON.stringify({
                        x: player.x, y: player.y, z: player.z, angle: player.angle, walk: player.walk,
                        carMode: carMode, carX: myCar.x, carZ: myCar.z, carAng: myCar.angle, ts: Date.now()
                    })
                });
                const [pRes, cRes] = await Promise.all([
                    fetch(DB_URL + "/online.json"),
                    fetch(DB_URL + "/chat.json?orderBy=\"$key\"&limitToLast=1")
                ]);
                const pData = await pRes.json() || {};
                const now = Date.now();
                remotePlayers = {};
                for (let [k, v] of Object.entries(pData)) {
                    if (k !== myNick && v && now - v.ts < 8000) remotePlayers[k] = v;
                }
                const cData = await cRes.json();
                if (cData) {
                    const id = Object.keys(cData).at(0);
                    if (id && id !== lastChatId) {
                        lastChatId = id;
                        addChat(cData[id].text);
                    }
                }
            } catch (e) {}
        }, 250);
        canvas.addEventListener('mousedown', () => { dragging = true; if (started && !chatOpen && canvas.requestPointerLock) canvas.requestPointerLock(); });
        window.addEventListener('mouseup', () => { dragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!started || chatOpen) return;
            if (document.pointerLockElement === canvas || dragging) {
                camYaw -= e.movementX * 0.005;
                camPitch = Math.max(-0.05, Math.min(1.15, camPitch + e.movementY * 0.004));
            }
        });
        window.addEventListener('wheel', (e) => { if (started) camDist = Math.max(2.5, Math.min(14, camDist + e.deltaY * 0.005)); });

        const keys = {};
        window.addEventListener('keydown', (e) => {
            if (!started) return;
            if (e.code === 'KeyT' && !chatOpen) {
                e.preventDefault(); chatOpen = true;
                if (document.exitPointerLock) document.exitPointerLock();
                const inp = document.getElementById('chat-input'); inp.style.display = 'block'; inp.focus();
                return;
            }
            if (chatOpen) {
                if (e.code === 'Enter') {
                    const inp = document.getElementById('chat-input'); const txt = inp.value.trim();
                    if (txt) {
                        const formatted = txt.startsWith('/me ') ? `<span style="color:#f472b6">* ${myNick} ${txt.slice(4)}</span>` : `${myNick}: ${txt}`;
                        sendChatOnline(formatted);
                    }
                    inp.value = ''; inp.style.display = 'none'; chatOpen = false;
                } else if (e.code === 'Escape') { document.getElementById('chat-input').style.display = 'none'; chatOpen = false; }
                return;
            }

            if (e.code === 'KeyF') {
                if (carMode === "none" && Math.hypot(player.x - myCar.x, player.z - myCar.z) < 4) {
                    carMode = "driver";
                    sendChatOnline(`<span style="color:#f472b6">* ${myNick} сел за руль автомобиля</span>`);
                } else if (carMode !== "none") {
                    carMode = "none";
                    player.x -= 2.2;
                    sendChatOnline(`<span style="color:#f472b6">* ${myNick} вышел из автомобиля</span>`);
                }
            }

            if (e.code === 'KeyG' && carMode === "none") {
                for (let [rNick, rp] of Object.entries(remotePlayers)) {
                    if (Math.hypot(player.x - rp.carX, player.z - rp.carZ) < 4.5) {
                        carMode = "passenger";
                        hostNick = rNick;
                        sendChatOnline(`<span style="color:#f472b6">* ${myNick} сел на пассажирское место к ${rNick}</span>`);
                        break;
                    }
                }
            }

            if (e.code === 'KeyH' && carMode === "none") {
                for (let [rNick, rp] of Object.entries(remotePlayers)) {
                    if (Math.hypot(player.x - rp.x, player.z - rp.z) < 3.5) {
                        sendChatOnline(`<span style="color:#f472b6">* ${myNick} пожал руку игроку ${rNick}</span>`);
                        break;
                    }
                }
            }

            keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function setCamera(eyeX, eyeY, eyeZ, tx, ty, tz) {
            const f = 1.0 / Math.tan(0.5), aspect = W / H, near = 0.2, far = 250;
            lastProj = new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)/(near-far),-1, 0,0,(2*far*near)/(near-far),0]);
            gl.uniformMatrix4fv(uProj, false, lastProj);

            let zx = eyeX - tx, zy = eyeY - ty, zz = eyeZ - tz, zl = Math.hypot(zx, zy, zz);
            zx /= zl; zy /= zl; zz /= zl;
            let xx = zz, xz = -zx, xl = Math.hypot(xx, xz) || 1; xx /= xl; xz /= xl;
            let yx = zy * xz, yy = zz * xx - zx * xz, yz = -zy * xx;
            lastView = new Float32Array([xx,yx,zx,0, 0,yy,0,0, xz,yz,zz,0, -(xx*eyeX+xz*eyeZ), -(yx*eyeX+yy*eyeY+yz*eyeZ), -(zx*eyeX+zy*eyeY+zz*eyeZ), 1]);
            gl.uniformMatrix4fv(uView, false, lastView);
        }

        function toScreen(wx, wy, wz) {
            if (!lastView || !lastProj) return null;
            const vx = lastView.at(0)*wx + lastView.at(4)*wy + lastView.at(8)*wz + lastView.at(12);
            const vy = lastView.at(1)*wx + lastView.at(5)*wy + lastView.at(9)*wz + lastView.at(13);
            const vz = lastView.at(2)*wx + lastView.at(6)*wy + lastView.at(10)*wz + lastView.at(14);
            if (vz >= -0.2) return null;
            const px = lastProj.at(0)*vx, py = lastProj.at(5)*vy, pw = -vz;
            return { x: (px / pw * 0.5 + 0.5) * W, y: (-py / pw * 0.5 + 0.5) * H };
        }
        function drawHuman(hx, hy, hz, ang, walk, r, g, b) {
            const isAir = hy > 0.04;
            const isMoving = walk > 0.01 && !isAir;
            const cycle = walk;
            const bob = isMoving ? Math.abs(Math.cos(cycle)) * 0.025 : Math.sin(Date.now() * 0.0025) * 0.008;

            const pc = Math.cos(ang), ps = Math.sin(ang);
            const p = (ox, oy, oz, sx, sy, sz, rx, cr, cg, cb) => {
                drawPart(hx + ox * pc + oz * ps, hy + bob + oy, hz - ox * ps + oz * pc, sx, sy, sz, ang, rx, cr, cg, cb);
            };

            const skin = [0.76, 0.56, 0.44];
            const beard = [0.12, 0.09, 0.08];
            const hoodie = [r, g, b];
            const whiteTee = [0.92, 0.92, 0.94];
            const jeans = [0.09, 0.10, 0.13];
            const glove = [0.08, 0.08, 0.09];
            const shoes = [0.95, 0.95, 0.97];

            let lean = isAir ? 0.14 : (isMoving ? 0.08 : 0.0);
            let hipL = 0, hipR = 0, kneeL = 0, kneeR = 0;
            let shL = 0, shR = 0, elbL = 0.25, elbR = 0.25;

            if (isAir) {
                hipL = -0.45; kneeL = 0.75;
                hipR = -0.15; kneeR = 0.45;
                shL = -0.25;  elbL = 0.85;
                shR = 0.20;   elbR = 0.75;
            } else if (isMoving) {
                hipL = Math.sin(cycle) * 0.48;
                hipR = -Math.sin(cycle) * 0.48;
                kneeL = Math.max(0, -Math.sin(cycle - 0.5)) * 0.85 + 0.12;
                kneeR = Math.max(0, Math.sin(cycle - 0.5)) * 0.85 + 0.12;

                shL = -Math.sin(cycle) * 0.42;
                shR = Math.sin(cycle) * 0.42;
                elbL = 0.35 + Math.max(0, Math.sin(cycle)) * 0.55;
                elbR = 0.35 + Math.max(0, -Math.sin(cycle)) * 0.55;
            } else {
                shL = Math.sin(Date.now() * 0.0025) * 0.03;
                shR = -shL;
            }

            const headZ = 0.02 + Math.sin(lean) * 0.25;
            p(0, 1.72, headZ, 0.22, 0.26, 0.23, 0, skin.at(0), skin.at(1), skin.at(2));
            p(0, 1.65, headZ + 0.06, 0.16, 0.12, 0.14, 0, beard.at(0), beard.at(1), beard.at(2));
            p(-0.045, 1.74, headZ + 0.10, 0.028, 0.02, 0.02, 0, 0.08, 0.08, 0.08);
            p(0.045, 1.74, headZ + 0.10, 0.028, 0.02, 0.02, 0, 0.08, 0.08, 0.08);
            p(0, 1.74, headZ - 0.04, 0.285, 0.31, 0.29, -0.05, hoodie.at(0), hoodie.at(1), hoodie.at(2));
            p(0, 1.56, headZ, 0.16, 0.16, 0.16, 0, whiteTee.at(0), whiteTee.at(1), whiteTee.at(2));

            p(0, 1.37, Math.sin(lean) * 0.14, 0.48, 0.38, 0.27, lean, hoodie.at(0), hoodie.at(1), hoodie.at(2));
            p(0, 1.15, Math.sin(lean) * 0.06, 0.42, 0.32, 0.25, lean, hoodie.at(0) * 0.95, hoodie.at(1) * 0.95, hoodie.at(2) * 0.95);
            p(0, 0.98, 0, 0.40, 0.12, 0.24, 0, whiteTee.at(0), whiteTee.at(1), whiteTee.at(2));
            p(0, 0.91, 0, 0.38, 0.08, 0.23, 0, 0.1, 0.1, 0.11);

            const drawArm = (side, shAng, elbAng) => {
                const ox = side * 0.27;
                const shY = 1.41, shZ = Math.sin(lean) * 0.16;
                const upperLen = 0.28, foreLen = 0.26;
                const elbY = shY - Math.cos(shAng) * upperLen;
                const elbZ = shZ - Math.sin(shAng) * upperLen;
                const foreAng = shAng - elbAng;
                const handY = elbY - Math.cos(foreAng) * foreLen;
                const handZ = elbZ - Math.sin(foreAng) * foreLen;

                p(ox, shY, shZ, 0.15, 0.15, 0.15, 0, hoodie.at(0), hoodie.at(1), hoodie.at(2));
                p(ox * 1.04, (shY + elbY) * 0.5, (shZ + elbZ) * 0.5, 0.135, upperLen + 0.06, 0.135, shAng, hoodie.at(0), hoodie.at(1), hoodie.at(2));
                p(ox * 1.04, elbY, elbZ, 0.12, 0.12, 0.12, 0, hoodie.at(0), hoodie.at(1), hoodie.at(2));
                p(ox * 1.05, (elbY + handY) * 0.5, (elbZ + handZ) * 0.5, 0.115, foreLen + 0.04, 0.115, foreAng, hoodie.at(0) * 0.95, hoodie.at(1) * 0.95, hoodie.at(2) * 0.95);
                p(ox * 1.05, handY, handZ, 0.10, 0.13, 0.10, foreAng, glove.at(0), glove.at(1), glove.at(2));
                p(ox * 1.05, handY, handZ + 0.035, 0.08, 0.07, 0.05, foreAng, 0.85, 0.85, 0.88);
            };
            drawArm(-1, shL, elbL);
            drawArm(1, shR, elbR);

            const drawLeg = (side, hipAng, kneeAng) => {
                const ox = side * 0.115;
                const hipY = 0.88, hipZ = 0;
                const thighLen = 0.40, shinLen = 0.38;
                const kneeY = hipY - Math.cos(hipAng) * thighLen;
                const kneeZ = hipZ - Math.sin(hipAng) * thighLen;
                const shinAng = hipAng + kneeAng;
                const ankleY = kneeY - Math.cos(shinAng) * shinLen;
                const ankleZ = kneeZ - Math.sin(shinAng) * shinLen;

                p(ox, (hipY + kneeY) * 0.5, (hipZ + kneeZ) * 0.5, 0.21, thighLen + 0.08, 0.22, hipAng, jeans.at(0), jeans.at(1), jeans.at(2));
                p(ox, kneeY, kneeZ, 0.18, 0.16, 0.18, 0, jeans.at(0), jeans.at(1), jeans.at(2));
                p(ox, (kneeY + ankleY) * 0.5, (kneeZ + ankleZ) * 0.5, 0.19, shinLen + 0.06, 0.20, shinAng, jeans.at(0), jeans.at(1), jeans.at(2));
                p(ox, ankleY - 0.03, ankleZ + 0.06, 0.16, 0.13, 0.30, 0, shoes.at(0), shoes.at(1), shoes.at(2));
            };
            drawLeg(-1, hipL, kneeL);
            drawLeg(1, hipR, kneeR);
        }

        function loop() {
            requestAnimationFrame(loop);

            if (started && !chatOpen) {
                if (carMode === "none") {
                    const fwdX = -Math.sin(camYaw), fwdZ = -Math.cos(camYaw);
                    const rightX = Math.cos(camYaw), rightZ = -Math.sin(camYaw);
                    let dx = 0, dz = 0;
                    if (keys['KeyW']) { dx += fwdX; dz += fwdZ; }
                    if (keys['KeyS']) { dx -= fwdX; dz -= fwdZ; }
                    if (keys['KeyD']) { dx += rightX; dz += rightZ; }
                    if (keys['KeyA']) { dx -= rightX; dz -= rightZ; }
                    const len = Math.hypot(dx, dz);
                    if (len > 0) {
                        const spd = keys['ShiftLeft'] ? 0.18 : 0.095;
                        player.x += (dx / len) * spd; player.z += (dz / len) * spd;
                        player.angle = Math.atan2(dx, dz); player.walk += spd * 0.65;
                    } else player.walk = 0;

                    if (keys['Space'] && player.y <= 0.01) player.vy = 0.18;
                    player.y += player.vy;
                    if (player.y > 0) player.vy -= 0.010; else { player.y = 0; player.vy = 0; }
                } else if (carMode === "driver") {
                    if (keys['KeyW']) myCar.speed = Math.min(myCar.speed + 0.018, 0.75);
                    else if (keys['KeyS']) myCar.speed = Math.max(myCar.speed - 0.018, -0.35);
                    else myCar.speed *= 0.96;
                    if (Math.abs(myCar.speed) > 0.01) {
                        const dir = myCar.speed > 0 ? 1 : -1;
                        if (keys['KeyA']) myCar.angle += 0.04 * dir;
                        if (keys['KeyD']) myCar.angle -= 0.04 * dir;
                    }
                    myCar.x += Math.sin(myCar.angle) * myCar.speed;
                    myCar.z += Math.cos(myCar.angle) * myCar.speed;
                    player.x = myCar.x; player.z = myCar.z;
                } else if (carMode === "passenger") {
                    const host = remotePlayers[hostNick];
                    if (host) {
                        player.x = host.carX; player.z = host.carZ;
                    } else carMode = "none";
                }
            }

            const tx = carMode === "driver" ? myCar.x : player.x;
            const ty = carMode !== "none" ? 1.1 : player.y + 1.35;
            const tz = carMode === "driver" ? myCar.z : player.z;
            const d = carMode !== "none" ? camDist + 2.5 : camDist;
            const eyeX = tx + Math.sin(camYaw) * Math.cos(camPitch) * d;
            const eyeY = ty + Math.sin(camPitch) * d;
            const eyeZ = tz + Math.cos(camYaw) * Math.cos(camPitch) * d;

            gl.clearColor(0.55, 0.78, 0.96, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            setCamera(eyeX, eyeY, eyeZ, tx, ty, tz);

            drawBox(0, -0.1, 0, 200, 0.2, 200, 0, texGrid, 1, 1, 1, 50);
            drawDetailedCar(myCar.x, myCar.z, myCar.angle, 0.55, 0.2, 0.9);
            if (carMode === "none") drawHuman(player.x, player.y, player.z, player.angle, player.walk, 0.14, 0.16, 0.22);

            const labels = document.getElementById('labels-layer');
            labels.innerHTML = "";
            for (let [rNick, rp] of Object.entries(remotePlayers)) {
                drawDetailedCar(rp.carX, rp.carZ, rp.carAng, 0.15, 0.65, 0.45);
                if (rp.carMode === "none") drawHuman(rp.x, rp.y, rp.z, rp.angle, rp.walk || 0, 0.28, 0.14, 0.18);

                const pos = toScreen(rp.x, rp.y + 2.15, rp.z);
                if (pos) {
                    const tag = document.createElement('div');
                    tag.className = 'player-tag';
                    tag.style.left = pos.x + 'px';
                    tag.style.top = pos.y + 'px';
                    tag.innerText = rNick + (rp.carMode === "driver" ? " [За рулём]" : "");
                    labels.appendChild(tag);
                }
            }
        }
        loop();
    </script>
</body>
