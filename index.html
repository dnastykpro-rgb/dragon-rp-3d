<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RADMIR WEB RP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { overflow: hidden; background: #0f172a; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
        canvas:active { cursor: grabbing; }

        #menu-overlay {
            position: fixed; inset: 0; background: rgba(10, 14, 24, 0.88);
            backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .menu-box {
            background: #181c2a; border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 24px; padding: 36px; width: 390px; text-align: center; color: white;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }
        .menu-box h1 { font-size: 28px; margin-bottom: 6px; color: #c084fc; }
        .menu-box p { font-size: 14px; color: #94a3b8; margin-bottom: 22px; }
        .menu-box input, .menu-box select {
            width: 100%; padding: 13px 16px; margin-bottom: 14px; border-radius: 14px;
            border: 1px solid #334155; background: #1e293b; color: white; font-size: 15px; outline: none;
        }
        .menu-box button {
            width: 100%; padding: 14px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, #9333ea, #6366f1); color: white;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .menu-box button:hover { filter: brightness(1.15); }
        #menu-error { color: #f87171; font-size: 13px; margin-bottom: 10px; min-height: 18px; }

        #hud { display: none; position: fixed; inset: 0; pointer-events: none; }
        #chat-container { position: absolute; top: 20px; left: 20px; width: 430px; pointer-events: auto; }
        #chat-messages {
            background: rgba(15, 23, 42, 0.7); border-radius: 16px; padding: 14px;
            height: 185px; overflow-y: auto; color: white; font-size: 14px; line-height: 1.45;
            display: flex; flex-direction: column; justify-content: flex-end; border: 1px solid rgba(255,255,255,0.1);
        }
        #chat-input {
            display: none; width: 100%; margin-top: 8px; padding: 11px 15px; border-radius: 12px;
            border: 1px solid #a855f7; background: #0f172a; color: white; font-size: 14px; outline: none;
        }
        #server-info {
            position: absolute; top: 20px; right: 20px; background: rgba(15, 23, 42, 0.75);
            padding: 12px 18px; border-radius: 16px; text-align: right; border: 1px solid rgba(255,255,255,0.1);
        }
        #server-badge { color: #c084fc; font-weight: bold; font-size: 15px; }
        #money-badge { color: #4ade80; font-weight: bold; font-size: 18px; margin-top: 4px; }
        #location-badge { color: #cbd5e1; font-size: 13px; margin-top: 4px; }
        #controls-hint {
            position: absolute; bottom: 20px; left: 20px; background: rgba(15, 23, 42, 0.75);
            color: #e2e8f0; padding: 12px 18px; border-radius: 16px; font-size: 13px; line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="menu-overlay">
        <div class="menu-box">
            <h1>RADMIR WEB RP</h1>
            <p>Выбери сервер и начни игру в 3D городе</p>
            <input type="text" id="nick-input" placeholder="Ник (например, Domik_Brane)" maxlength="20">
            <select id="server-select">
                <option value="Server #01 | Арзамас">Server #01 | Арзамас</option>
                <option value="Server #02 | Южный">Server #02 | Южный</option>
            </select>
            <div id="menu-error"></div>
            <button onclick="startGame()">ПОДКЛЮЧИТЬСЯ</button>
        </div>
    </div>

    <div id="hud">
        <div id="server-info">
            <div id="server-badge">Server #01 | Арзамас</div>
            <div id="money-badge">50 000 ₽</div>
            <div id="location-badge">Район: Центральный проспект</div>
        </div>
        <div id="chat-container">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Сообщение или команды: /me, /do, /n, /gps...">
        </div>
        <div id="controls-hint">
            <b>WASD</b> — Ходьба / Езда | <b>Shift</b> — Бег<br>
            <b>F</b> — Сесть / Выйти из машины | <b>T</b> — Чат | <b>Мышь</b> — Вращать камеру
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        let playerNick = "Domik_Brane";
        let isGameStarted = false;
        let isChatOpen = false;
        let camYaw = 0;
        let camPitch = 0.32;

        const player = { x: -4, z: 10, angle: 0, walkTime: 0 };
        const cars = [
            { x: 3.5, z: 10, angle: 0, speed: 0, color: '#18181b', roof: '#09090b', name: 'BMW M5 F90' },
            { x: -16, z: -12, angle: 0.5, speed: 0, color: '#9333ea', roof: '#6b21a8', name: 'Nissan GT-R' }
        ];
        let currentCar = null;

        const buildings = [
            { x: 26, z: -25, w: 28, d: 14, h: 11, color: '#991b1b', top: '#7f1d1d', windows: false },
            { x: 12, z: -25, w: 6, d: 6, h: 22, color: '#b91c1c', top: '#14532d', windows: false },
            { x: -26, z: -22, w: 24, d: 18, h: 9, color: '#0284c7', top: '#0369a1', windows: true },
            { x: 12, z: 42, w: 5, d: 5, h: 4, color: '#f8fafc', top: '#2563eb', windows: false },
            { x: -25, z: 24, w: 14, d: 14, h: 18, color: '#cbd5e1', top: '#64748b', windows: true },
            { x: -25, z: 52, w: 14, d: 14, h: 25, color: '#fde68a', top: '#d97706', windows: true },
            { x: 26, z: 26, w: 14, d: 14, h: 20, color: '#e2e8f0', top: '#475569', windows: true }
        ];

        const trees = [];
        for (let z = -75; z <= 75; z += 18) {
            if (Math.abs(z) < 12) continue;
            trees.push({ x: -11, z: z }, { x: 11, z: z });
        }

        function project(x, y, z, camX, camY, camZ) {
            let dx = x - camX, dy = y - camY, dz = z - camZ;
            let cosY = Math.cos(-camYaw), sinY = Math.sin(-camYaw);
            let rx = dx * cosY - dz * sinY;
            let rz = dx * sinY + dz * cosY;

            let cosP = Math.cos(-camPitch), sinP = Math.sin(-camPitch);
            let ry = dy * cosP - rz * sinP;
            let fz = dy * sinP + rz * cosP;

            if (fz < 0.4) return null;
            let fov = H * 0.9;
            return { x: W / 2 + (rx / fz) * fov, y: H / 2 - (ry / fz) * fov, z: fz };
        }

        function drawBox(cx, cy, cz, w, h, d, angle, colorSide, colorTop, camX, camY, camZ, hasWindows = false) {
            let hw = w / 2, hd = d / 2;
            let cos = Math.cos(angle), sin = Math.sin(angle);
            let pts3d = [
                [-hw, 0, -hd], [hw, 0, -hd], [hw, 0, hd], [-hw, 0, hd],
                [-hw, h, -hd], [hw, h, -hd], [hw, h, hd], [-hw, h, hd]
            ];
            let c = pts3d.map(p => project(p * cos - p * sin + cx, p + cy, p * sin + p * cos + cz, camX, camY, camZ));
            if (c.some(pt => pt === null)) return;

            function poly(idxList, col) {
                ctx.beginPath();
                ctx.moveTo(c[idxList].x, c[idxList].y);
                for (let i = 1; i < idxList.length; i++) ctx.lineTo(c[idxList[i]].x, c[idxList[i]].y);
                ctx.closePath();
                ctx.fillStyle = col;
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.22)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            poly(, colorSide);
            poly(, colorSide);
            poly(, colorSide);
            poly(, colorSide);
            poly(, colorTop);

            if (hasWindows && h >= 8) {
                for (let wy = 2.5; wy < h - 2; wy += 3.5) {
                    let winP = project(cx, cy + wy, cz - hd - 0.1, camX, camY, camZ);
                    let winP2 = project(cx, cy + wy, cz + hd + 0.1, camX, camY, camZ);
                    [winP, winP2].forEach(wp => {
                        if (wp && wp.z < 120) {
                            let size = Math.max(2, 160 / wp.z);
                            ctx.fillStyle = '#38bdf8';
                            ctx.fillRect(wp.x - size * 1.4, wp.y - size / 2, size * 0.8, size);
                            ctx.fillRect(wp.x + size * 0.6, wp.y - size / 2, size * 0.8, size);
                        }
                    });
                }
            }
        }
        let isDragging = false;
        canvas.addEventListener('mousedown', () => {
            isDragging = true;
            if (isGameStarted && !isChatOpen && canvas.requestPointerLock) canvas.requestPointerLock();
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mousemove', (e) => {
            if (!isGameStarted || isChatOpen) return;
            if (document.pointerLockElement === canvas || isDragging) {
                camYaw += e.movementX * 0.005;
                camPitch = Math.max(-0.1, Math.min(1.1, camPitch + e.movementY * 0.004));
            }
        });

        function startGame() {
            const nick = document.getElementById('nick-input').value.trim();
            if (nick.length < 3) {
                document.getElementById('menu-error').innerText = "Введите ник минимум из 3 символов!";
                return;
            }
            playerNick = nick;
            document.getElementById('server-badge').innerText = document.getElementById('server-select').value;
            document.getElementById('menu-overlay').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            isGameStarted = true;
            addChatMessage(`<span style="color:#facc15">[Сервер]: Добро пожаловать на RADMIR WEB RP, ${playerNick}!</span>`);
            addChatMessage(`<span style="color:#c084fc">[Подсказка]: Кликни мышью по экрану, чтобы крутить камеру вверх/вниз и вокруг.</span>`);
        }

        function addChatMessage(html) {
            const box = document.getElementById('chat-messages');
            box.innerHTML += `<div>${html}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        const keys = {};
        window.addEventListener('keydown', (e) => {
            if (!isGameStarted) return;
            if (e.code === 'KeyT' && !isChatOpen) {
                e.preventDefault();
                isChatOpen = true;
                if (document.exitPointerLock) document.exitPointerLock();
                const inp = document.getElementById('chat-input');
                inp.style.display = 'block';
                inp.focus();
                return;
            }
            if (isChatOpen) {
                if (e.code === 'Enter') {
                    const inp = document.getElementById('chat-input');
                    const txt = inp.value.trim();
                    if (txt) {
                        if (txt === '/gps') addChatMessage(`<span style="color:#38bdf8">[GPS]: 1. Кремль | 2. Автосалон | 3. Пост ДПС</span>`);
                        else if (txt.startsWith('/me ')) addChatMessage(`<span style="color:#f472b6">* ${playerNick} ${txt.slice(4)}</span>`);
                        else if (txt.startsWith('/do ')) addChatMessage(`<span style="color:#38bdf8">${txt.slice(4)} (${playerNick})</span>`);
                        else if (txt.startsWith('/n ')) addChatMessage(`<span style="color:#9ca3af">(( ${playerNick}: ${txt.slice(3)} ))</span>`);
                        else addChatMessage(`${playerNick}: ${txt}`);
                    }
                    inp.value = '';
                    inp.style.display = 'none';
                    isChatOpen = false;
                } else if (e.code === 'Escape') {
                    document.getElementById('chat-input').style.display = 'none';
                    isChatOpen = false;
                }
                return;
            }
            if (e.code === 'KeyF') {
                if (!currentCar) {
                    for (let c of cars) {
                        if (Math.hypot(player.x - c.x, player.z - c.z) < 4.5) {
                            currentCar = c;
                            addChatMessage(`<span style="color:#f472b6">* ${playerNick} открыл дверь и сел в ${c.name}</span>`);
                            break;
                        }
                    }
                } else {
                    player.x = currentCar.x - 2.5;
                    player.z = currentCar.z;
                    addChatMessage(`<span style="color:#f472b6">* ${playerNick} вышел из ${currentCar.name}</span>`);
                    currentCar = null;
                }
            }
            keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function loop() {
            requestAnimationFrame(loop);

            if (isGameStarted && !isChatOpen) {
                if (!currentCar) {
                    let spd = keys['ShiftLeft'] ? 0.25 : 0.14;
                    let moved = false, dx = 0, dz = 0;
                    if (keys['KeyW']) { dx += Math.sin(camYaw); dz += Math.cos(camYaw); moved = true; }
                    if (keys['KeyS']) { dx -= Math.sin(camYaw); dz -= Math.cos(camYaw); moved = true; }
                    if (keys['KeyA']) { dx -= Math.cos(camYaw); dz += Math.sin(camYaw); moved = true; }
                    if (keys['KeyD']) { dx += Math.cos(camYaw); dz -= Math.sin(camYaw); moved = true; }
                    if (moved) {
                        player.x += dx * spd;
                        player.z += dz * spd;
                        player.angle = Math.atan2(dx, dz);
                        player.walkTime += spd * 1.6;
                    } else {
                        player.walkTime = 0;
                    }
                } else {
                    if (keys['KeyW']) currentCar.speed = Math.min(currentCar.speed + 0.02, 0.8);
                    else if (keys['KeyS']) currentCar.speed = Math.max(currentCar.speed - 0.02, -0.35);
                    else currentCar.speed *= 0.96;

                    if (Math.abs(currentCar.speed) > 0.01) {
                        let dir = currentCar.speed > 0 ? 1 : -1;
                        if (keys['KeyA']) currentCar.angle -= 0.04 * dir;
                        if (keys['KeyD']) currentCar.angle += 0.04 * dir;
                    }
                    currentCar.x += Math.sin(currentCar.angle) * currentCar.speed;
                    currentCar.z += Math.cos(currentCar.angle) * currentCar.speed;
                }
            }

            let target = currentCar || player;
            let dist = 11;
            let camX = target.x - Math.sin(camYaw) * Math.cos(camPitch) * dist;
            let camY = 1.8 + Math.sin(camPitch) * dist;
            let camZ = target.z - Math.cos(camYaw) * Math.cos(camPitch) * dist;

            const loc = document.getElementById('location-badge');
            if (target.x > 5 && target.z < -5) loc.innerText = "Район: Арзамасский Кремль";
            else if (target.x < -10 && target.z < -5) loc.innerText = "Район: Автосалон Люкс";
            else if (target.z > 32) loc.innerText = "Район: Пост ДПС";
            else loc.innerText = "Район: Центральный проспект";

            let horizonY = H * (0.48 + Math.sin(camPitch) * 0.45);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, 0, W, Math.max(0, horizonY));
            ctx.fillStyle = '#365314';
            ctx.fillRect(0, Math.max(0, horizonY), W, H);

            drawBox(0, 0, 0, 18, 0.03, 240, 0, '#64748b', '#94a3b8', camX, camY, camZ);
            drawBox(0, 0.03, 0, 13, 0.04, 240, 0, '#0f172a', '#1e293b', camX, camY, camZ);
            drawBox(0, 0.03, 0, 240, 0.04, 13, 0, '#0f172a', '#1e293b', camX, camY, camZ);
            for (let z = -100; z <= 100; z += 14) {
                if (Math.abs(z) > 10) drawBox(0, 0.08, z, 0.35, 0.02, 5, 0, '#facc15', '#facc15', camX, camY, camZ);
            }

            let renderList = [];
            buildings.forEach(b => {
                let p = project(b.x, b.h / 2, b.z, camX, camY, camZ);
                if (p) renderList.push({ z: p.z, draw: () => drawBox(b.x, 0, b.z, b.w, b.h, b.d, 0, b.color, b.top, camX, camY, camZ, b.windows) });
            });

            trees.forEach(t => {
                let p = project(t.x, 2, t.z, camX, camY, camZ);
                if (p) renderList.push({ z: p.z, draw: () => {
                    drawBox(t.x, 0, t.z, 0.5, 2.5, 0.5, 0, '#78350f', '#451a03', camX, camY, camZ);
                    drawBox(t.x, 2.5, t.z, 2.8, 3.2, 2.8, 0, '#15803d', '#22c55e', camX, camY, camZ);
                }});
            });

            cars.forEach(c => {
                let p = project(c.x, 1, c.z, camX, camY, camZ);
                if (p) renderList.push({ z: p.z, draw: () => {
                    drawBox(c.x, 0.35, c.z, 2.2, 0.65, 4.4, c.angle, c.color, c.roof, camX, camY, camZ);
                    drawBox(c.x, 1.0, c.z, 1.8, 0.55, 2.2, c.angle, '#020617', '#1e293b', camX, camY, camZ);
                    let fx = c.x + Math.sin(c.angle) * 2.22;
                    let fz = c.z + Math.cos(c.angle) * 2.22;
                    drawBox(fx, 0.55, fz, 1.6, 0.2, 0.1, c.angle, '#fef08a', '#fef08a', camX, camY, camZ);
                }});
            });

            if (!currentCar) {
                let p = project(player.x, 1, player.z, camX, camY, camZ);
                if (p) renderList.push({ z: p.z, draw: () => {
                    let swing = Math.sin(player.walkTime) * 0.35;
                    drawBox(player.x - 0.18, 0, player.z + swing, 0.24, 0.8, 0.24, player.angle, '#1e293b', '#334155', camX, camY, camZ);
                    drawBox(player.x + 0.18, 0, player.z - swing, 0.24, 0.8, 0.24, player.angle, '#1e293b', '#334155', camX, camY, camZ);
                    drawBox(player.x, 0.8, player.z, 0.75, 0.9, 0.38, player.angle, '#1d4ed8', '#3b82f6', camX, camY, camZ);
                    drawBox(player.x, 1.7, player.z, 0.5, 0.5, 0.5, player.angle, '#22c55e', '#4ade80', camX, camY, camZ);
                    let headPos = project(player.x, 2.45, player.z, camX, camY, camZ);
                    if (headPos) {
                        ctx.fillStyle = 'white';
                        ctx.font = 'bold 13px Segoe UI';
                        ctx.textAlign = 'center';
                         ctx.fillText(playerNick, headPos.x, headPos.y);
                        }
                         }});
                        }
                         renderList.sort((a, b) => b.z - a.z);
                         renderList.forEach(item => item.draw());
                        }
                         loop();
            </script>
</body>
</html>
